he process setpoint is input in Hz, and the output of the PID controller is used as an rpm value in speed control."], "74.15": [639, "See parameter 74.14 Setpoint scaling."], "74.16": [639, "See parameter 40.16 Set 1 setpoint 1 source."], "74.19": [639, "See parameter 40.19 Set 1 internal setpoint sel1."], "74.20": [639, "See parameter 40.20 Set 1 internal setpoint sel2."], "74.21": [639, "See parameter 40.21 Set 1 internal setpoint 1. Description"], "74.22": [640, "See parameter 40.22 Set 1 internal setpoint 2."], "74.23": [640, "See parameter 40.23 Set 1 internal setpoint 3. See parameter 40.26 Set 1 setpoint min."], "74.31": [640, "See parameter 40.31 Set 1 deviation inversion."], "74.32": [640, "See parameter 40.32 Set 1 gain."], "74.33": [640, "See parameter 40.33 Set 1 integration time."], "74.34": [640, "See parameter 40.34 Set 1 derivation time."], "74.35": [640, "See parameter 40.35 Set 1 derivation filter time. See parameter 40.36 Set 1 output min."], "74.37": [640, "See parameter 40.37 Set 1 output max."], "74.38": [640, "See parameter 40.38 Set 1 output freeze enable."], "74.39": [640, "The control program compares the absolute value of parameter 74.04 Deviation act value to the deadband range defined by this parameter."], "74.40": [640, "Defines the deadband delay for the deadband function. See parameter 74.39 Deadband range."], "74.58": [640, "See parameter 71.58 Increase prevention."], "74.59": [640, "See parameter 71.59 Decrease prevention."], "74.62": [640, "See parameter 40.62 PID internal setpoint actual. Description PFC (Pump and fan control), multipump and autochange configuration parameters."], "76.01": [641, "Displays the running/stopped status of the PFC motors. PFC1, PFC2, PFC3, PFC4, PFC5 and PFC6 always correspond to the 1st…6th motor of the PFC system."], "76.02": [641, "Displays the status of the multipump system in text format. Provides a quick PFC or IPC system overview, for example, if the parameter is added to the Home view on the control panel."], "76.11": [644, "Shows the status of pump or fan 1. Value 0 = False, 1 = True 0 = False, 1 = True 0 = False, 1 = True"], "76.12": [644, "See parameter 76.11 Pump/fan status 1."], "76.13": [644, "See parameter 76.11 Pump/fan status 1."], "76.14": [644, "See parameter 76.11 Pump/fan status 1."], "76.15": [644, "See parameter 76.11 Pump/fan status 1."], "76.16": [644, "See parameter 76.11 Pump/fan status 1."], "76.17": [644, "See parameter 76.11 Pump/fan status 1. Only for IPC."], "76.18": [644, "See parameter 76.11 Pump/fan status 1. Only for IPC."], "76.21": [644, "Selects the multi-pump/fan mode. Disabled."], "76.22": [645, "Node number of the drive on inverter-to-inverter link. Note: • Each drive on the link has a unique node number. • Node numbers of the drives must be sequential starting from 1, so that if there are, for example, four nodes, they must be 1, 2, 3 and 4."], "76.23": [645, "Selects if this pump operate as a master drive of the IPC system. The master drive must have sensor connection in order to control the process."], "76.24": [645, "interface, or fieldbus adapter interface with FMBA-01 adapter. Using the FMBA-01 adapter allows embedded fieldbus to be used for other purposes, for example, BACnet MS/TP connection to building automation system. If parameters have been incorrectly defined, the drive generates warning A6E7 IPC configuration warning."], "76.25": [645, "Total number of motors used in the application, including the motor connected directly to the drive."], "76.30": [646, "Defines the start speed or frequency (Hz/rpm) for the first auxiliary motor. As the motor speed or frequency exceeds the limit defined by this parameter, a new auxiliary motor is started."], "76.31": [646, "Defines the start speed or frequency (Hz/rpm) for the second auxiliary motor."], "76.32": [646, "Defines the start speed or frequency (Hz/rpm) for the third auxiliary motor."], "76.33": [646, "Defines the start speed or frequency (Hz/rpm) for the fourth follower pump/auxiliary motor. See parameter 76.30 Start point 1."], "76.34": [647, "Defines the start speed or frequency (Hz/rpm) for the fifth follower pump/auxiliary motor."], "76.35": [647, "Defines the start speed or frequency (Hz/rpm) for the sixth follower pump/auxiliary motor. See parameter 76.30 Start point 1."], "76.36": [647, "Defines the start speed or frequency (Hz/rpm) for the seventh follower pump/auxiliary motor. See parameter 76.30 Start point 1."], "76.41": [647, "Defines the stop speed or frequency (Hz/rpm) for the first auxiliary motor. When the speed or frequency of the motor connected directly to the drive falls below this value and one auxiliary motor is running, the stop delay defined by parameter 76.56 Stop delay is started."], "76.42": [647, "Defines the stop speed or frequency (Hz/rpm) for the second auxiliary motor."], "76.43": [647, "Defines the stop speed or frequency (Hz/rpm) for the third auxiliary motor."], "76.44": [647, "Defines the stop speed or frequency (Hz/rpm) for the fourth follower pump/auxiliary motor."], "76.45": [647, "Defines the stop speed or frequency (Hz/rpm) for the fifth follower pump/auxiliary motor."], "76.46": [647, "Defines the stop speed or frequency (Hz/rpm) for the sixth follower pump/auxiliary motor."], "76.47": [647, "Defines the stop speed or frequency (Hz/rpm) for the seventh follower pump/auxiliary motor. See parameter 76.41 Stop point 1."], "76.55": [647, "Defines the delay time for starting the auxiliary motors. See parameter 76.31 Start point 1."], "76.56": [647, "Defines the delay time for starting the auxiliary motors. See parameter 76.31 Stop point 1."], "76.57": [648, "Start point 1."], "76.58": [648, "Stop point 1."], "76.59": [648, "Start delay for the motor that is directly controlled by the drive. This does not affect the starting of the auxiliary motors. WARNING! There must always be a delay set if the motors are equipped with star-delta starters. The delay must be set longer than the time setting of the starter."], "76.60": [648, "Defines the acceleration time for the drive motor speed compensation, when an auxiliary motor is stopped. This ramp time is also used for the drive motor to accelerate after an autochange has occurred."], "76.61": [648, "Defines the deceleration time for the drive motor speed compensation, when an auxiliary motor is started. This ramp time is also used for the drive motor to decelerate after an autochange has occurred."], "76.62": [648, "Defines the ramp time of a new starting pump. A pump that is started by current master follows the speed until all the pumps rotate at the same speed and master role is changed."], "76.63": [648, "Defines the ramp time that is used to stop the pump. A pump that is stopped by current master follows the speed until it is stopped completely."], "76.64": [649, "Defines the maximum time the drive waits between it receives a command to start and the condition defined in parameter 20.40 Run permissive to be satisfied. The drive trips on fault D40D Multipump run permissive timeout if the timer expires before it receives the run permissive. The next pump is started if available."], "76.70": [649, "Defines the way the autochange is triggered. In all cases except Even wear, the start order is moved one step forward each time the autochange occurs. If the start order initially is 1-2-3-4, after the first autochange the order will be 2-3-4-1, etc."], "76.71": [650, "Specifies the interval that is used in setting Fixed interval of parameter 76.70 PFC Autochange."], "76.72": [650, "Specifies the maximum wear imbalance, or difference in running times between any motor, used by the Even wear setting of parameter 76.70 PFC Autochange."], "76.73": [650, "Upper speed limit for the Autochange to occur. The Autochange occurs when: • the condition defined in 76.70 PFC Autochange is fulfilled and, • the speed of the drive motor 01.03 Motor speed % is below the speed limit defined in this parameter."], "76.74": [650, "Selects whether only auxiliary motors or all motors are included in the Autochange function."], "76.76": [650, "stationary. The IPC system uses pump priorities to start/stop the pumps."], "76.77": [650, "Selects the priority of the pump in an IPC system. Note: Parameter 76.76 Max stationary time defines the maximum time that a low priority pump can be stationary."], "76.81": [651, "Defines if the PFC motor 1 can be started. An interlocked PFC motor cannot be started. 0 = Interlocked (not available) 1 = Available."], "76.82": [651, "See parameter 76.81 PFC 1 interlock."], "76.83": [651, "See parameter 76.81 PFC 1 interlock."], "76.84": [651, "See parameter 76.81 PFC 1 interlock."], "76.85": [651, "See parameter 76.81 PFC 1 interlock."], "76.86": [651, "See parameter 76.81 PFC 1 interlock."], "76.95": [651, "Defines if direct-on-line pumps are automatically started and stopped. This setting can be used in applications with a low number of sensors and low accuracy requirements."], "77.10": [652, "Enables the reset, or arbitrary setting, of 77.11 Pump/fan 1 running time77.18 Pump 8 running time."], "77.11": [653, "Running time counter of pump/fan 1. Can be set or reset by parameter 77.10 PFC runtime change."], "77.12": [653, "See parameter 77.11 Pump/fan 1 running time."], "77.13": [653, "See parameter 77.11 Pump/fan 1 running time."], "77.14": [653, "See parameter 77.11 Pump/fan 1 running time."], "77.15": [653, "See parameter 77.11 Pump/fan 1 running time."], "77.16": [653, "See parameter 77.11 Pump/fan 1 running time."], "77.17": [653, "Running time counter of pump 7. For IPC only."], "77.18": [653, "Running time counter of pump 8. For IPC only."], "77.20": [653, "Displays the pumps which can establish connection through inverter-to-inverter communication. For example, in a three pump system, drive 1 and drive 2 can see each other but drive 3 cannot see other drives. Drive 1 = 0011b, Drive 2 = 0011b, Drive 3 = 0100b Name Descriptions Node 1 Pump 1 is online."], "77.21": [654, "Displays the drives communication loss status. You can override default communication loss actions by setting start interlock or constant speed based on the bit values. Note: Bits will reset to zero when communication is restored."], "80.01": [654, "Actual system flow that is either calculated from the pressure difference, measured directly or estimated from the pump curves. The calculation method is selected with parameter 80.13 Flow feedback function. See control chain diagram PID flow calculation on page 373. Notes: • This parameter is read-only."], "80.02": [654, "Shows the percentage of parameter 80.01 Actual flow from 80.15 Maximum flow."], "80.03": [655, "Shows the cumulative calculated volume. Notes: • This parameter is read-only. • By default the unit will be m3. However, the unit can be changed according to the parameter 81.21 Flow unit. • Total calculated volume. Shows the ratio of pump flow rate and power input. Note: By default the flow unit will be m3/kWh."], "80.05": [655, "Shows the estimated head produced by the pump. Note: By default the unit will be m. However, the unit can be changed according to the parameter 81.22 Length unit. Note: This parameter is read-only."], "80.11": [655, "Selects the source for the flow feedback 1. Feedback not used."], "80.12": [655, "Selects the source for the flow feedback 2. For the selections, see parameter 80.11 Flow feedback 1 source."], "80.13": [655, "Selects a function between the flow feedback sources selected by parameters 80.11 Flow feedback 1 source and 80.12 Flow feedback 2 source. The result of the function (for any selection) is multiplied by parameter 80.14 Flow feedback multiplier."], "80.14": [656, "Defines the multiplier (k) used with the flow calculation The output value of 80.13 Flow feedback function is multiplied by this value."], "80.15": [657, "Defines the nominal maximum flow of the system. This value is used to calculate the actual flow percentage value so that the value 100% for 80.02 corresponds to the value of this parameter. Note: By default the flow unit will be m3/h."], "80.16": [657, "Defines the nominal minimum flow of the system. Note: By default the flow unit will be m3/h. However, the unit can be changed according to the parameter 81.21 Flow unit. Limit for minimum flow protection. Selects the action for maximum flow protection function."], "80.19": [657, "Defines the time after motor start when the flow protection is active."], "80.21": [657, "Definition speed of the pump curve used, normally the pump's nominal speed. Used as reference speed for sensorless flow calculation, see section Sensorless flow calculation on page 156. Only visible in vector control mode."], "80.22": [657, "Defines the pump inlet pipe diameter. Note: By default the unit will be m. However, the unit can be changed according to the parameter 81.22 Length unit."], "80.23": [657, "Defines the pump outlet pipe diameter. Note: By default the unit will be m. However, the unit can be changed according to the parameter 81.22 Length unit."], "80.26": [658, "Defines the speed limit below which flow is not calculated. Minimum speed limit for flow calculation."], "80.28": [658, "Defines the density of the fluid to be pumped for the flow calculation function. Note: By default the unit will be kg/m3. However, the unit can be changed according to the parameter 81.23 Density unit. Fluid density. Resets signal 80.03 Total volume."], "80.41": [658, "Defines the head at point 2 of the H performance curve. See parameter 80.40 H curve H1 (page 658)."], "80.42": [658, "Defines the head at point 3 of the H performance curve. See parameter 80.40 H curve H1 (page 658)."], "80.43": [658, "Defines the head at point 4 of the H performance curve. See parameter 80.40 H curve H1 (page 658)."], "80.44": [658, "Defines the head at point 5 of the H performance curve. See parameter 80.40 H curve H1 (page 658)."], "80.45": [658, "Defines the head at point 6 of the H performance curve. See parameter 80.40 H curve H1 (page 658)."], "80.46": [658, "Defines the head at point 7 of the H performance curve. See parameter 80.40 H curve H1 (page 658)."], "80.47": [658, "Defines the head at point 8 of the H performance curve. See parameter 80.40 H curve H1 (page 658)."], "80.48": [658, "Defines the head at point 9 of the H performance curve. See parameter 80.40 H curve H1 (page 658)."], "80.49": [658, "Defines the head at point 10 of the H performance curve."], "80.50": [658, "See parameter 80.40 H curve H1 (page 658). Defines the power input of pump at point 1 on the P performance curve. Note: By default the unit will be kW. However, the unit can be changed according to the parameter 96.16 Unit selection bit 00 Power unit."], "80.51": [659, "Defines the power input of pump at point 2 on the PQ and HQ performance curves."], "80.52": [659, "Defines the power input of pump at point 3 on the PQ and HQ performance curves."], "80.53": [659, "Defines the power input of pump at point 4 on the PQ and HQ performance curves."], "80.54": [659, "Defines the power input of pump at point 5 on the PQ and HQ performance curves."], "80.55": [659, "Defines the power input of pump at point 6 on the PQ and HQ performance curves."], "80.56": [659, "Defines the power input of pump at point 7 on the PQ and HQ performance curves."], "80.57": [659, "Defines the power input of pump at point 8 on the PQ and HQ performance curves."], "80.58": [659, "Defines the power input of pump at point 9 on the PQ and HQ performance curves."], "80.59": [659, "Defines the power input of pump at point 10 on the PQ and HQ performance curves."], "80.60": [659, "Defines the flow rate at point 1 on the PQ and HQ performance curves. Note: By default the flow unit will be m3/h. However, the unit can be changed according to the parameter 81.21 Flow unit."], "80.61": [659, "Defines the flow rate at point 2 on the PQ and HQ performance curves."], "80.62": [659, "Defines the flow rate at point 3 on the PQ and HQ performance curves."], "80.63": [659, "Defines the flow rate at point 4 on the PQ and HQ performance curves."], "80.64": [659, "Defines the flow rate at point 5 on the PQ and HQ performance curves."], "80.65": [659, "Defines the flow rate at point 6 on the PQ and HQ performance curves. See parameter 80.60 Q value Q1 (page 659)."], "80.66": [660, "Defines the flow rate at point 7 on the PQ and HQ performance curves."], "80.67": [660, "Defines the flow rate at point 8 on the PQ and HQ performance curves."], "80.68": [660, "Defines the flow rate at point 9 on the PQ and HQ performance curves."], "80.69": [660, "Defines the flow rate at point 10 on the PQ and HQ performance curves. See parameter 80.60 Q value Q1 (page 659)."], "81.01": [660, "Shows the actual inlet pressure. Notes: • This parameter is read-only. • By default the parameter unit will be bar. However, the unit can be changed according to the parameter 81.20 Pressure unit."], "81.02": [660, "Shows the actual outlet pressure. Notes: • This parameter is read-only. • By default the parameter unit will be bar. However, the unit can be changed according to the parameter 81.20 Pressure unit."], "81.10": [660, "Selects the primary source used for pump inlet pressure measurement."], "81.11": [661, "Selects the primary source used for pump outlet pressure measurement."], "81.12": [661, "Defines the height difference between inlet and outlet pressure sensors for flow calculation. Note: By default the unit will be m. However, the unit can be changed according to the parameter 81.22 Length unit."], "81.20": [661, "Selects the unit of pressure. Pressure."], "81.21": [661, "Selects the unit of flow. The selection also affects volume and specific energy units."], "81.22": [661, "Selects the unit of estimated head points, sensors height difference and pump inlet/outlet diameters."], "81.23": [661, "Selects the unit of density. Kilograms per cubic meter."], "81.30": [661, "Displays the calculated refrigerant gas temperature."], "81.35": [661, "Selects the type of the gas. The functionality is disabled when the gas type is set to Not selected. Pressure ranges for the gases are given below. Warning D58B Gas pressure outside limits is thrown when the pressure input is outside the limits."], "81.36": [662, "Selects the input of the gas pressure source. Note: AI3 scaled…AI5 scaled values are visible only if the CAIO-01 analog option module is attached and configured properly, with parameter 07.36 Drive configuration bit 8 (CAIO-01) set high."], "81.37": [662, "Selects the pressure unit of the refrigerant gas selected with parameter 81.35 Refrigerant gas type."], "81.38": [662, "Defines the Antoine coefficient A for parameter 81.35 Refrigerant gas type."], "81.39": [662, "Defines the Antoine coefficient B for parameter 81.35 Refrigerant gas type."], "81.40": [662, "Defines the Antoine coefficient C for parameter 81.35 Refrigerant gas type. See parameter 81.38 Antoine coefficient A."], "81.41": [663, "Defines the lowest pressure that parameter 81.35 Refrigerant gas type can reach before triggering warning D58B Gas pressure outside limits and preventing the calculation of parameter 81.30 Actual gas temperature."], "81.42": [663, "Defines the highest pressure that parameter 81.35 Refrigerant gas type can reach before triggering warning D58B Gas pressure outside limits and preventing the calculation of 81.30 Actual gas temperature."], "82.20": [663, "Selects dry run protection mode. See section Dry pump protection (page 158). Dry run protection is disabled."], "82.21": [663, "Selects the source for dry run protection. Activates dry run protection (parameter 37.01 ULC output"], "82.25": [664, "Selects the drive action in case the system does not reach the setpoint in time defined with parameter 82.26 Time-out limit. The time is calculated with the last reference change in parameter 40.03 Process PID setpoint actual. See section Soft pipe fill (page 155)."], "82.26": [664, "Defines the delay time at which setpoint must be reached after last change in PID reference ramp output."], "82.30": [664, "Enables outlet minimum pressure protection function. Outlet minimum pressure protection function is disabled."], "82.31": [664, "Defines the level at which drive should generate the outlet minimum pressure warning. Note: By default the parameter unit will be bar."], "82.32": [664, "Defines the level at which drive should generate the outlet minimum pressure fault. Note: By default the parameter unit will be bar."], "82.35": [664, "Enables outlet maximum pressure protection function. Outlet maximum pressure protection is disabled."], "82.37": [665, "Defines the level at which drive should generate the outlet maximum pressure warning. Note: By default the parameter unit will be bar."], "82.38": [665, "Defines the level at which drive should generate the outlet maximum pressure fault. Note: By default the parameter unit will be bar."], "82.40": [665, "Enables inlet minimum pressure protection function. Inlet minimum pressure protection is disabled."], "82.41": [665, "Defines the level at which drive should generate the inlet minimum pressure warning. Note: By default the parameter unit will be bar. However, the unit can be changed according to the parameter 81.20 Pressure unit."], "82.42": [666, "Defines the level at which drive should generate the inlet minimum pressure fault. Note: By default the parameter unit will be bar. However, the unit can be changed according to the parameter 81.20 Pressure unit. Defines the delay time at which the pressure supervisions are inactive."], "82.46": [666, "Enables and determines the behavior of the reverse flow detector. When enabled, the drive performs a brief test at intervals specified by parameter 82.48 Reverse flow detection check period when the drive is stopped with no faults or inhibits."], "82.47": [666, "Absolute speed threshold for check valve leak detection. The drive takes the action selected in 82.46 Reverse flow detection action when the speed is measured above this value or below its negative value."], "82.48": [666, "Time elapsed between speed detection checks."], "82.51": [667, "Selects pump protection faults that are automatically reset. The parameter is a 16-bit word with each bit corresponding to a fault type. Whenever a bit is set to 1, the corresponding fault is automatically reset after 82.52 Pump protection autoreset delay time."], "82.52": [667, "Defines the time that the drive will wait after a pump protection fault before attempting an automatic reset."], "84.01": [668, "Selects the advanced damper configuration. Disables advanced damper. the relay outputs (see selection bit 63 for parameters 10.24, 10.27, and 10.30). When start is requested (start command or override), the drive will command the discharge damper to open."], "84.02": [669, "Status of the dampers, damper commands and if timeout detected. Description 1 = Discharge air damper is closed. 1 = Discharge air damper is opening. 1 = Discharge air damper is closing. 1 = Discharge air damper is commanded to open. 1 = Outside air damper is closed. 1 = Outside air damper is opening."], "84.03": [669, "Selects which digital input (or its inverse) is wired to the open end switch of the DA damper."], "84.04": [670, "Time the drive will wait after commanding the DA damper to open till the DA damper open end switch confirms the open position of the damper (see parameter 84.03)."], "84.05": [670, "Selects the action the drive will take if the DA damper was commanded to open and the operation timed out."], "84.06": [670, "Selects which digital input (or its inverse) is wired to the closed end switch of the DA damper. Closed end switch is not used. Closed end switch is not used. DI1 wired to the closed end switch. DI2 wired to the closed end switch. DI3 wired to the closed end switch. DI4 wired to the closed end switch."], "84.07": [671, "Time the drive will wait after commanding the DA damper to close till the DA damper closed end switch confirms the closed position of the damper (see parameter 84.06)."], "84.08": [671, "Selects the action the drive will take if the DA damper was commanded to close and the operation timed out."], "84.13": [671, "Selects which digital input (or its inverse) is wired to the open end switch of the OA damper. For the other selections, see parameter 84.03."], "84.15": [672, "Selects the action the drive will take if the OA damper was commanded to open and the operation timed out."], "84.16": [672, "Selects which digital input (or its inverse) is wired to the closed end switch of the OA damper. For the other selections, see parameter 84.06."], "84.17": [672, "Time the drive will wait after commanding the OA damper to close till the OA damper closed end switch confirms the closed position of the damper (see parameter 84.16)."], "84.18": [672, "Selects the action the drive will take if the OA damper was commanded to close and the operation timed out."], "84.99": [673, "This parameter is updated by the E-Clipse Advanced Damper Control application and controls the ACH580 application. Value 1 = OA damper is closed. 1 = OA damper is open. 1 = DA damper is closed. 1 = DA damper is open."], "94.01": [673, "Enables/disables the internal INU-LSU state machine. When the state machine is enabled, the inverter unit (INU) controls the supply unit (LSU) and prevents the inverter unit from starting until the supply unit is ready."], "94.02": [673, "Enables/disables control panel and PC tool access to the supply unit (line-side converter) via the inverter unit (motor- side converter). Note: This feature is only supported by ACH580-31 and ACH580-34."], "94.04": [673, "Defines INU-LSU status word profile. Note: This feature is only supported by ACH580-31 and ACH580-34."], "94.05": [674, "(This parameter is visible only if INU-ISU communication is enabled in parameter 95.20 bit 15.) Selects the source for LSU external start command."], "94.10": [674, "Defines the maximum time the supply unit (LSU) is allowed for charging before fault 7584 LSU charge failed is generated."], "94.11": [674, "Defines a stop delay for the supply unit. This parameter can be used to delay the opening of the main breaker/contactor when a restart is expected."], "94.22": [674, "Defines the DC voltage reference for the supply unit."], "94.30": [674, "Displays the reactive power reference sent to the supply unit. - Reactive power reference sent to the supply unit."], "94.31": [674, "Selects the source of the reactive power reference to be sent to the supply unit."], "94.32": [675, "Defines the primary reactive power reference for the supply unit. Primary user reactive power reference."], "94.33": [675, "Selects the reactive power reference type, unit, range, and resolution."], "94.34": [675, "Defines the alternative reactive power reference for the supply unit. Description Secondary user reactive power reference."], "94.40": [676, "Defines the maximum shaft power for motoring mode upon a supply network failure when IGBT supply unit control is active (bit 15 of 95.20 HW options word 1 is on)."], "94.41": [676, "Defines the maximum shaft power for generating upon a supply network failure when supply unit control is active (bit 15 of 95.20 HW options word 1 is on)."], "94.43": [676, "Defines the minimum power limit percentage of LSU nominal power. This parameter can be set to utilize up to 50% of ISU nominal power for regenerative power. Active braking will activate during flying start of the motor to allow fast speed reversal during start."], "94.44": [676, "Selects the source for disabling the active braking functionality. This parameter can be used to disable the active braking functionality even in the conditions mentioned for parameter 94.43, for cases when the primary supply would be switched to backup generator supply."], "94.50": [676, "Enables LSU weak grid detection on ACH580-31/-34 drives to improve stability in weak grids and when the drive is supplied by a generator."], "95.01": [677, "Selects the supply voltage range. This parameter is used by the drive to determine the nominal voltage of the supply network. The parameter also affects the DC voltage control functions of the drive (see section DC voltage control on page 216)."], "95.02": [678, "Enables adaptive voltage limits. Adaptive voltage limits can be used if, for example, an IGBT supply unit is used to raise the DC voltage level. If the communication between the inverter and IGBT supply unit is active, the voltage limits are related to the DC voltage reference from the IGBT supply unit."], "95.03": [678, "AC supply voltage estimated by calculation. Estimation is done every time the drive is powered up and is based on the rise speed of voltage level of the DC bus while the drive charges the DC bus. This parameter is read-only. Note: This parameter is not used for ACH580-31 and ACH580-34."], "95.04": [678, "Specifies how the control board of the drive is powered. The drive control board is powered from the drive power unit"], "95.15": [679, "Contains hardware-related settings that can be enabled and disabled by toggling the specific bits. Notes: • The installation of the hardware specified by this parameter may require derating of drive output, or impose other limitations. See (ATEX) the Hardware manual of the drive."], "95.20": [680, "Specifies hardware-related options that require differentiated parameter defaults. This parameter is not affected by a parameter restore. For motor disconnect in vector mode, make sure to: 1. set parameter 95.26 value to Disable 2. enable 31.12 bit 5."], "95.21": [681, "Specifies more hardware-related options that require differentiated parameter defaults. See parameter 95.20 HW options word 1. WARNING! After switching any bits in this word, recheck the values of the affected parameters."], "95.26": [681, "Detects if motor is disconnected and shows a warning of disconnected motor. When this parameter is enabled, the drive will do the following: 1. The drive detects if the motor is disconnected from the drive (all three phases). 2."], "96.01": [682, "Selects the language of the parameter interface and other English displayed information when viewed on the control panel. The drive supports multiple languages. The languages are divided in three firmware packages: Global, European and Asian."], "96.02": [684, "Pass codes can be entered into this parameter to activate further access levels (see parameter 96.03 Access level status) or to configure the user lock. Entering “358” toggles the parameter lock, which prevents the changing of all other parameters through the control panel or the Drive composer PC tool."], "96.03": [684, "Shows which access levels have been activated by pass codes entered into parameter 96.02 Pass code."], "96.04": [684, "Selects the control macro. See chapter Default I/O configuration (page 101) for more information. After a selection is made, the parameter reverts automatically to Done."], "96.05": [684, "Shows which control macro is currently selected. See chapter Default I/O configuration (page 101) for more information. To change the macro, use parameter 96.04 Macro select. Note: This parameter is read-only. Factory default (page 103)."], "96.06": [685, "Restores the original settings of the control program, ie, parameter default values. Notes: • This parameter cannot be changed while the drive is running. • This parameter is write protected while user lock is active."], "96.07": [686, "Saves the valid parameter values to the permanent memory on the drive control unit to ensure that operation can continue after cycling the power."], "96.08": [686, "Changing the value of this parameter to 1 reboots the control unit (without requiring a power off/on cycle of the complete drive module). The value reverts to 0 automatically."], "96.10": [686, "Shows the status of the user parameter sets. This parameter is read-only. See also section Data storage parameters (page 232)."], "96.11": [687, "Enables the saving and restoring of up to four custom sets of No action parameter settings. See section User parameter sets (page 226). The set that was in use before powering down the drive is in use after the next power-up."], "96.12": [687, "When parameter 96.11 User set save/load is set to User set I/O mode, selects the user parameter set together with parameter 96.13 User set I/O mode in2 as follows: Status of source Status of source User parameter defined by par. defined by par."], "96.13": [688, "See parameter 96.12 User set I/O mode in1."], "96.16": [688, "Selects the unit of parameters indicating power, temperature and torque."], "96.20": [688, "Defines the first priority external source for synchronization of the drive’s time and date. The date and time can also be directly set into parameters 96.24…96.26, in which case this parameter is ignored. Fieldbus interface A, FENA/FPNO can get the time from SNTP server and set it as time for the drive."], "96.24": [689, "The number of full days passed since beginning of the year 1980. This parameter, together with 96.25 Time in minutes within 24h and 96.26 Time in ms within one minute makes it possible to set the date and time in the drive via the parameter interface from a fieldbus or application program."], "96.25": [689, "The number of full minutes passed since midnight. For example, the value 860 corresponds to 2:20 pm."], "96.26": [689, "The number of milliseconds passed since the previous minute. See parameter 96.24 Full days since 1st Jan 1980."], "96.39": [689, "Information 0 = Disabled = Event will not be logged 1 = Enabled = Event B681 will be logged 0 = Disabled = Event will not be logged 1 = Enabled = Event B682 will be logged 0 = Disabled = Event will not be logged 1 = Enabled = Event B683 will be logged 0 = Disabled = Event will not be logged 1 = Enabled = Event B687 wil"], "96.51": [689, "Clears all events from the drive’s fault and event logs. See section Warning/fault history on page 238."], "96.68": [690, "Displays the actual parameter configuration checksum. Checksum A calculation does not include • fieldbus settings. The parameters included in the calculation are user editable parameters in parameter groups 10…13, 15, 19…25, 28, 30…32, 34…37, 40…41, 43, 45…46, 70…74, 76, 80, 94…99."], "96.69": [691, "Displays the actual parameter configuration checksum B. Checksum B calculation does not include • fieldbus settings • motor data settings • energy data settings."], "96.70": [691, "Enables/disables the adaptive program (if present). See also section Adaptive programming (page 113)."], "96.71": [691, "Approved (reference) checksum A. Approved checksum A."], "96.72": [691, "Approved (reference) checksum B. Approved checksum B."], "96.78": [691, "Enables/disables a Modbus user to access a select set of parameters using legacy register numbering. See the supported parameters in section Parameters supported by Modbus legacy compatibility on page 709."], "96.79": [692, "This parameter enables ACx550 control profiles on ACx580 drives. Note that if the parameter selection changes, also parameter 58.25 Control profile changes to a matching selection and the parameter is locked."], "97.01": [694, "Defines the switching frequency of the drive that is used as long as the drive stays below the thermal limit. See section Switching frequency on page 200. Higher switching frequency results in lower acoustic motor noise. Lower switching frequency generates less switching losses and reduce EMC emissions."], "97.02": [694, "Lowest switching frequency value that is allowed. Depends on the frame size. When drive is reaching the thermal limit, it will automatically start to reduce the switching frequency until the minimum allowed value is reached."], "97.03": [695, "Defines the slip gain which is used to improve the estimated motor slip. 100% means full slip gain; 0% means no slip gain. The default value is 100%. Other values can be used if a static speed error is detected despite having the setting at full slip gain."], "97.04": [695, "Defines the minimum allowed voltage reserve. When the voltage reserve has decreased to the set value, the drive enters the field weakening area. Note: This is an expert level parameter and should not be adjusted without appropriate skill."], "97.05": [695, "Defines the level of flux braking power. (Other stopping and braking modes can be configured in parameter group 21 Start/stop mode). Note: This is an expert level parameter and should not be adjusted without appropriate skill. Flux braking is disabled. Flux level is limited during the braking."], "97.08": [696, "This parameter can be used to improve the control dynamics of a synchronous reluctance motor or a salient permanent magnet synchronous motor. As a rule of thumb, define a level to which the output torque must rise with minimum delay."], "97.10": [696, "Enables the anti-cogging function: a high-frequency alternating signal is injected to the motor in the low speed region to improve the stability of torque control. This removes the “cogging” that can sometimes be seen as the rotor passes the motor magnetic poles."], "97.13": [697, "Defines the relative output voltage boost at zero speed (IR compensation). The function is useful in applications with a high break-away torque where vector control cannot be applied. U / UN (%) Relative output voltage. IR compensation set to 15%. 100% 15% Relative output voltage. No IR compensation."], "97.15": [697, "Enables the motor model temperature adaptation. Estimated motor temperature can be used to adapt temperature dependent parameters (for example, resistances) of motor model."], "97.16": [697, "Tunes the motor temperature dependence of stator parameters (stator resistance)."], "97.17": [697, "Tunes the motor temperature dependence of rotor parameters (eg."], "97.20": [698, "Selects the form for the U/f (voltage to frequency) ratio below field weakening point. For scalar control only. Notes: • The U/f function cannot be used with energy optimization; if 45.11 Energy optimizer is set to Enable, parameter 97.20 U/F ratio is ignored."], "97.23": [698, "Enables or disables the long cable mode. Consult ABB for guidance Long cable mode is disabled."], "97.48": [698, "Enables or disables the DC bus voltage stabilizer. When enabled, the gain can be selected from the list."], "97.49": [698, "Sets gain for slip compensation in percent when the drive is operating in scalar control mode. A squirrel-cage motor slips under load. Increasing the frequency as the motor torque increases compensates for the slip."], "97.94": [698, "Sets the frequency at which IR compensation set by parameter 97.13 IR compensation reaches 0 V."], "98.01": [699, "Activates the motor model parameters 98.02…98.12 and 98.14. Notes: • Parameter value is automatically set to zero when ID run is selected by parameter 99.13 ID run requested. The values of parameters 98.02…98.12 are then updated according to the motor characteristics identified during the ID run."], "98.02": [699, "Defines the stator resistance RS of the motor model. With a star-connected motor, RS is the resistance of one winding."], "98.03": [699, "Defines the rotor resistance RR of the motor model. Note: This parameter is valid only for asynchronous motors."], "98.04": [699, "Defines the main inductance LM of the motor model. Note: This parameter is valid only for asynchronous motors."], "98.05": [699, "Defines the leakage inductance LS. Note: This parameter is valid only for asynchronous motors."], "98.06": [699, "Defines the direct axis (synchronous) inductance. Note: This parameter is valid only for permanent magnet motors."], "98.07": [699, "Defines the quadrature axis (synchronous) inductance. Note: This parameter is valid only for permanent magnet motors."], "98.08": [700, "Defines the permanent magnet flux. Note: This parameter is valid only for permanent magnet motors."], "98.09": [700, "Defines the stator resistance RS of the motor model."], "98.10": [700, "Defines the rotor resistance RR of the motor model. Note: This parameter is valid only for asynchronous motors."], "98.11": [700, "Defines the main inductance LM of the motor model. Note: This parameter is valid only for asynchronous motors."], "98.12": [700, "Defines the leakage inductance LS. Note: This parameter is valid only for asynchronous motors."], "98.13": [700, "Defines the direct axis (synchronous) inductance. Note: This parameter is valid only for permanent magnet motors."], "98.14": [700, "Defines the quadrature axis (synchronous) inductance. Note: This parameter is valid only for permanent magnet motors."], "99.03": [700, "Selects the motor type. Note: This parameter cannot be changed while the drive is running."], "99.04": [701, "Vector control. Vector control has better accuracy than scalar"], "99.06": [701, "Defines the nominal motor current. Must be equal to the value on the motor rating plate. If multiple motors are connected to the drive, enter the total current of the motors. Notes: • Correct motor operation requires that the magnetizing current of the motor does not exceed 90% of the nominal current of the drive."], "99.07": [702, "Defines the nominal motor voltage supplied to the motor. This setting must match the value on the rating plate of the motor. Notes: • With permanent magnet motors, the nominal voltage is the BackEMF voltage at nominal speed of the motor."], "99.08": [702, "Defines the nominal motor frequency. This setting must match the value on the rating plate of the motor."], "99.09": [702, "Defines the nominal motor speed. The setting must match the value on the rating plate of the motor."], "99.10": [702, "Defines the nominal motor power. The setting must match the value on the rating plate of the motor. If multiple motors are connected to the drive, enter the total power of the motors. The unit is selected by parameter 96.16 Unit selection. Note: This parameter cannot be changed while the drive is running."], "99.11": [702, "Defines the cosphi of the motor for a more accurate motor model. The value is not obligatory, but is useful with an asynchronous motor, especially when performing a standstill identification run. With a permanent magnet or synchronous reluctance motor, this value is not needed."], "99.12": [703, "Defines the nominal motor shaft torque for a more accurate motor model. Not obligatory. The unit is selected by parameter 96.16 Unit selection."], "99.13": [703, "Selects the type of the motor identification routine (ID run) performed at the next start of the drive. During the ID run, the drive will identify the characteristics of the motor for optimum motor control."], "99.14": [705, "Shows the type of ID run that was performed last. For more information about the different modes, see the selections of parameter 99.13 ID run requested. Note: This parameter is read-only."], "99.15": [705, "Calculated number of pole pairs in the motor. Note: This parameter is read-only."], "99.16": [706, "Switches the rotation direction of motor. This parameter can be used if the motor turns in the wrong direction (for example, because of the wrong phase order in the motor cable), and correcting the cabling is considered impractical."], "21.19": [485, "Selects the motor start function for the scalar motor control mode, ie, when 99.04 Motor control mode is set to Scalar. Notes: • The start function for the vector motor control mode is selected by parameter 21.01 Start mode. • With permanent magnet motors, Automatic start mode must be used."], "20.01": [469, "Selects the source of start, stop and direction commands for external control location 1 (EXT1). See parameter 20.21 for the determination of the actual direction. See also parameters 20.02…20.05."], "20.02": [471, "Defines whether the start signal for external control location EXT1 is edge-triggered or level-triggered. Note: If a pulse type start signal is selected, this parameter is only effec <h2>Drive terminals</h2>${wrow('DCOM (12) tied to','w','dcom',w.dcom,RAILS)}
${[1,2,3,4,5,6].map(n=>wrow(`DI${n} (${12+n}) wired to`,'w','di'+n,w['di'+n],SRC)).join('')}
${wrow('AI1 (2) wired to','w','ai1',w.ai1,[['open','Nothing'],['pot','Potentiometer (+10 V 4, AGND 3)'],['loop','Current loop (BAS setpoint)']])}
${wrow('AI1 hardware mode','w','ai1mode',w.ai1mode,[['V','Voltage'],['mA','Current']])}
${wrow('AI2 (5) wired to','w','ai2',w.ai2,[['open','Nothing'],['xd','Pressure transducer 4-20 mA (AGND 6)']])}
${wrow('AI2 hardware mode','w','ai2mode',w.ai2mode,[['mA','Current'],['V','Voltage']])}
<h2>Safe torque off (X4: 34 to 38)</h2>${wrow('Jumper OUT1 (34) to IN1 (37)','w','sto1',String(w.sto1),INST)}${wrow('Jumper OUT2 (35) to IN2 (38)','w','sto2',String(w.sto2),INST)}
<h2>Power cables</h2>${wrow('Line L1/L2/L3 to the drive input','w','line',w.line,[['ok','Connected'],['off','Not connected']])}${wrow('Motor U1/V1/W1 to T1/T2/T3','w','motor',w.motor,[['ok','Connected'],['swap','Two leads swapped'],['open','Not connected']])}
<h2>Field device rail wires</h2>${Object.entries(FIELD).map(([k,t])=>wrow(`${t}, other side`,'f',k+'.feed',f[k].feed,RAILS)).join('')}
<h2>Signals seen by the drive</h2>${[1,2,3,4].map(n=>sig('DI'+n,E.di(C,n))).join('')}<div class="sig"><span class="on">AI1</span> ${R.aiVal.toFixed(2)} ${a.unit}: ${a.why}</div><div class="sig"><span class="on">AI2</span> ${R.ai2Val.toFixed(2)} ${a2.unit}: ${a2.why}</div>
<h2>Terminal usage (from the parameters)</h2>${usageRows()}
<details><summary>Terminal list (ACH580 firmware manual, Default I/O configuration)</summary><table class="tt">${TERMINALS.map(t=>`<tr><td>${t[0]}</td><td>${t[1]}</td></tr>`).join('')}</table></details>
<p class="hint">Training rule: a digital input is active when its switch rail differs from the DCOM rail. DCOM on DGND with a +24V switch is source-style; DCOM on +24V with a DGND switch is sink-style. Verify the real DCOM arrangement in the hardware manual.</p>`},
params:()=>`<div class="wr"><select id="qg" aria-label="Parameter group"><option value="">All groups</option><option value="sim"${qg==='sim'?' selected':''}>Simulated parameters only</option>${Object.keys(GROUPS).map(n=>`<option value="${n}"${n===qg?' selected':''}>${n} ${GROUPS[n]}</option>`).join('')}</select></div>
<input type="search" id="q" placeholder="Search by ID or name" value="${esc(q)}" aria-label="Search parameters"><div id="plist">${plist()}</div>
<p class="hint">All ${PARAMS.length-1} parameters of firmware manual Rev B are listed and every writable one can be edited here and on the panel (selections, numbers, hex bit fields, free values). Groups 01 to 09 and the other read-only signals are display values; ${PARAMS.filter(p=>p.ro&&p.live).length} of them show live values from the simulation. ${PARAMS.filter(p=>p.live&&!p.ro).length} writable parameters change the simulation (wiring and parameters must agree); the rest are stored, range checked and shown only. Parameters marked "cannot be changed while the drive is running" refuse changes until you press Off.</p>`,
faults:()=>{const act=R.fault?`<div class="bad"><b>Tripped:</b> ${R.fault} ${E.evName(R.fault)}</div>`:'<div class="on">No active fault</div>';
 return `${act}<button class="btn" data-act="reset">Reset fault</button>
<h2>Fault injection</h2><label class="tog"><span>Remove AI1 signal</span><input type="checkbox" data-inj="aiLoss" ${C.inject.aiLoss?'checked':''}></label>
<label class="tog"><span>Overload the motor</span><input type="checkbox" data-inj="overload" ${C.inject.overload?'checked':''}></label>
<p class="hint">Deliberate changes. To see 80A0: set 12.17 AI1 min to 2, 12.04 to 0001h, 12.03 to Fault (Params tab, group 12), run in Auto, then remove the AI1 signal. To see 5091 Safe torque off: remove an STO jumper on the Wiring tab. By default AI supervision is off.</p>
<h2>History</h2>${R.hist.length?R.hist.map(h=>`<div class="sig">${mmss(h.t)} <span class="tag ${h.type}">${h.type}</span> ${h.key!=='reset'?h.key+' ':''}${h.text}</div>`).join(''):'<p class="hint">No events yet.</p>'}
<h2>Catalog (codes from the manual)</h2>${EVENTS.map(e=>`<div class="item"><b>${e.key} ${e.name}</b><span class="tag ${e.kind}">${e.kind}</span><span class="tag ${e.live?'live':''}">${e.live?'simulated':'reference only'}</span><div class="hint">Cause: ${e.cause}<br>Check: ${e.checks}</div></div>`).join('')}`},
learn:()=>{const L=C.les.lesson;
 return `<h2>Lessons</h2><div class="seg">${[['hvac','HVAC macro start-up'],['two','Carrier 2-speed retrofit'],['pid','PID supply fan']].map(([k,t])=>`<button class="btn ${L===k?'selb':''}" data-act="les_${k}">${t}</button>`).join('')}</div>
${lessonBody()}
${L==='two'||L==='pid'?`<details><summary>Answer key</summary><p class="hint">Enters every parameter of this lesson in the guide order through the same rules as the panel (the drive is stopped first). Use it to compare, then try it yourself on the panel.</p><button class="btn" data-act="key_${L}">Enter the parameters</button></details>`:''}
<div id="lchk">${lchk()}</div>
<h2>Scenario</h2><button class="btn" data-act="fast">Simulation speed: ${C.fast?'5x (tap for 1x)':'1x (tap for 5x)'}</button><button class="btn" data-act="pause">${R.paused?'Resume':'Pause'} simulation</button><button class="btn" data-act="factory">Restore factory state</button>
<button class="btn" data-act="export">Export JSON</button><button class="btn" data-act="import">Import JSON</button><textarea id="json" aria-label="Scenario JSON"></textarea>
<h2>What is simulated</h2><p class="hint">Panel views, menu structure, default I/O, parameter IDs and defaults, interlock behavior, EXT1/EXT2, constant frequencies, process PID, AI1/AI2, STO and event codes follow the ABB manual. The macro (96.04), save (96.07) and restore (96.06) parameters act and revert to Done as on the drive. If 99.06 is still 0, the current shown assumes a 10 A motor. Ramps, current, overload timing, coast time, the PID scaling, the duct model and wiring rules are simplified training models. This app is not endorsed by ABB or Carrier, controls no equipment, and does not replace the manuals, the retrofit guide, qualified personnel or safe commissioning.</p>`}};
function plist(){const f=q.toLowerCase().trim();const all=PARAMS.filter(p=>(!qg||(qg==='sim'?p.live:(p.id||'').startsWith(qg+'.')))&&(!f||(p.id||'').includes(f)||p.name.toLowerCase().includes(f)));
 const rows=all.slice(0,lim).map(p=>{const v=C.params[p.k];let inp;
  if(p.ro){const x=p.id?E.roVal(p.id,C,R):undefined;inp=`<span>${esc(x===undefined?p.def:typeof x==='number'?x.toFixed(2):x)} (read-only)</span>`}
  else if(p.choices)inp=`<select data-p="${p.k}" aria-label="${esc(p.name)}">${opt(p.choices.map((c,i)=>[p.vals[i],esc(c)]),v)}</select>`;
  else if(p.hex)inp=`<input type="text" data-ph="${p.k}" value="${esc(v)}" aria-label="${esc(p.name)}" maxlength="9" autocapitalize="characters">`;
  else if(p.text)inp=`<input type="text" data-pt="${p.k}" value="${esc(v)}" aria-label="${esc(p.name)}" maxlength="40">`;
  else if(p.min!==undefined)inp=`<input type="number" inputmode="decimal" step="any" data-p="${p.k}" value="${v}" aria-label="${esc(p.name)}">`;
  else inp=`<span>${esc(v)}</span>`;
  const range=p.free?'any value':p.min!==undefined?`${p.min} to ${p.max} ${esc(p.unit||'')}`:p.hex?'hex bit field':'';
  return `<div class="item"><div class="pr"><div><b>${p.id||'\u2014'} ${esc(p.name)}</b><span class="tag ${p.live?'live':''}">${p.ro?(p.live?'live value':'signal'):p.live?'simulated':'stored'}</span><div class="hint">${range}${p.note?' '+esc(p.note):''}</div><div class="hint">${esc(p.desc||'')}</div>${(()=>{const m=MDATA[p.id];return m?K.MANUAL.card(m[0],(m[1]||p.name).split(' ').slice(0,5).join(' '),m[1]||p.name):''})()}</div>${inp}</div><div class="bad" id="e-${p.k}"></div></div>`}).join('');
 return (rows||'<p class="hint">No match.</p>')+(all.length>lim?`<button class="btn" data-act="more">Show more (${all.length-lim} left)</button>`:'')}
function show(){document.body.dataset.view=tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('sel',b.dataset.tab===tab));$('#tray').innerHTML=views[tab]()}
const wireClear=()=>{Object.assign(C.wiring,{...E.defaults().wiring});for(const k in FIELD)C.field[k].feed='none'};
const wireTo=(w,feeds)=>{wireClear();Object.assign(C.wiring,w);for(const k of feeds)C.field[k].feed='+24V'};
function applyKey(id){const list=keyList[id]();E.setMode(C,R,'OFF');E.halt();for(const[pid,v]of list)E.setParam(C,KOF[pid],v)}
const acts={more:()=>{lim+=60;show()},reset:()=>{E.reset(C,R);show()},pause:()=>{R.paused=!R.paused;show()},fast:()=>{C.fast=!C.fast;show()},
 wiredemo:()=>{Object.assign(C.wiring,{dcom:'DGND',di1:'runSw',di4:'intSw',ai1:'pot',ai1mode:'V'});C.field.runSw.feed='+24V';C.field.intSw.feed='+24V';save();show()},
 wireHvac:()=>{acts.wiredemo()},
 wireTwo:()=>{wireTo({dcom:'DGND',di1:'runSw',di2:'spd1Sw',di3:'spd2Sw',di4:'intSw'},['runSw','spd1Sw','spd2Sw','intSw']);save();show()},
 wirePid:()=>{wireTo({dcom:'DGND',di1:'runSw',di5:'frzSw',di4:'intSw',ai1:'loop',ai1mode:'mA',ai2:'xd',ai2mode:'mA'},['runSw','frzSw','intSw']);save();show()},
 wireclear:()=>{wireClear();save();show()},
 nextTag:()=>{C.les.tag=(C.les.tag+1)%TAGS.length;save();show()},
 cycle:()=>{C.power=true;R=E.newRuntime();P=K.newPanel();C.mode='AUTO';C.les.offPressed=false;save();show()},
 les_hvac:()=>{C.les.lesson='hvac';save();show()},les_two:()=>{C.les.lesson='two';save();show()},les_pid:()=>{C.les.lesson='pid';save();show()},
 key_two:()=>{applyKey('two');save();show()},key_pid:()=>{applyKey('pid');save();show()},
 factory:()=>{if(confirm('Restore the factory simulator state? Wiring, parameter edits and lesson progress will be lost.')){C=E.defaults();R=E.newRuntime();P=K.newPanel();save();show()}},
 export:()=>{$('#json').value=JSON.stringify({app:'ach580-trainer',v:3,config:C},null,1)},
 import:()=>{try{const j=JSON.parse($('#json').value);if(j.app!=='ach580-trainer'||!j.config)throw 0;C=E.merge(E.defaults(),j.config);save();R=E.newRuntime();P=K.newPanel();show();$('#json').value=''}catch{$('#json').value='Import failed: paste a scenario exported from this app.'}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;show()}else acts[t.dataset.act]?.()});
let rep=null;const stopRep=()=>{clearTimeout(rep);clearInterval(rep);rep=null};
const key=k=>{K.press(C,R,P,k);save();draw()};
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();const k=b.dataset.k;key(k);
 if(['up','down','left','right'].includes(k)){stopRep();rep=setTimeout(()=>{rep=setInterval(()=>key(k),120)},450)}});
['pointerup','pointercancel','pointerleave'].forEach(n=>document.addEventListener(n,stopRep));
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Escape:'back'}[e.key];if(m&&!e.target.closest('button')){e.preventDefault();key(m)}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(e.target.id==='qg'){qg=e.target.value;lim=60;$('#plist').innerHTML=plist();return}
 if(d.sw){C.field[d.sw].closed=e.target.checked}else if(d.inj){C.inject[d.inj]=e.target.checked}
 else if(d.pw){C.power=e.target.checked;R=E.newRuntime();P=K.newPanel();if(C.power){C.mode='AUTO';C.les.offPressed=false}}
 else if(d.les){C.les[d.les]=e.target.checked}
 else if(d.w!==undefined){const v=e.target.value;C.wiring[d.w]=(d.w==='sto1'||d.w==='sto2')?v==='true':v}
 else if(d.f){const[a,b]=d.f.split('.');C.field[a][b]=e.target.value}
 else if(d.p){const p=E.P_BY[d.p],err=$('#e-'+p.k);
  if(p.choices){E.setParam(C,p.k,Number(e.target.value));err.textContent=E.takeNote();e.target.value=C.params[p.k]}
  else{const v=Number(e.target.value);if(e.target.value===''||!Number.isFinite(v)||v<p.min||v>p.max){err.textContent=p.free?'Enter a number.':`Enter a value from ${p.min} to ${p.max} ${p.unit||''}.`;e.target.value=C.params[p.k];return}E.setParam(C,p.k,v);err.textContent=E.takeNote();e.target.value=C.params[p.k]}}
 else if(d.pt){const p=E.P_BY[d.pt];E.setParam(C,p.k,e.target.value);$('#e-'+p.k).textContent=''}
 else if(d.ph){const p=E.P_BY[d.ph],err=$('#e-'+p.k),r=E.setParam(C,p.k,e.target.value);if(r===C.params[p.k]&&String(e.target.value).toUpperCase().replace(/H$/,'').padStart(4,'0')+'h'!==C.params[p.k]){err.textContent=E.takeNote()||'Enter 1 to 8 hex digits, for example 0001h.';e.target.value=C.params[p.k];return}err.textContent=E.takeNote()}
 else return;save();if(d.p||d.pt||d.ph){if(p0(d))return}show()});
function p0(d){const k=d.p||d.pt||d.ph;return ['macroSel','saveP','restore'].includes(k)?(show(),true):true}
document.addEventListener('input',e=>{const d=e.target.dataset;
 if(d.sl){C.field[d.sl]=Number(e.target.value);const v=C.field[d.sl];$('#o-'+d.sl).textContent=d.sl==='pot'?`${(v/10).toFixed(1)} V`:d.sl==='loop'?`${v.toFixed(1)} mA`:`${v} %`;save()}
 else if(e.target.id==='q'){q=e.target.value;lim=60;$('#plist').innerHTML=plist()}});
let last=performance.now(),tk=0;setInterval(()=>{const n=performance.now(),dt=Math.min(0.25,(n-last)/1000);last=n;const wn=R.hist.length,k=C.fast?5:1;for(let i=0;i<k;i++)E.tick(C,R,dt);
 const h=C.les.hits;let ch=false;
 if(R.constN&&R.ref>0&&Math.abs(R.hz-R.ref)<0.15&&!R.fault){const r=Math.round(R.ref);if(!h[r]){h[r]=true;ch=true}}
 if(R.pid.on&&Math.abs(R.pid.dev)<0.03&&R.hz>1){R.settleT+=dt;if(R.settleT>6&&!h.pid){h.pid=true;ch=true}}else R.settleT=0;
 if(R.warns.has('AFEE')&&C.params.il1txt===4&&!h.il){h.il=true;ch=true}
 if(R.fault==='5091'&&R.ro1&&!h.sto&&lab0('ro1src')==='Fault'){h.sto=true;ch=true}
 if(ch)save();
 draw();if(tab==='faults'&&R.hist.length!==wn)show();
 tk++;if(tk%10===0){if(tab==='learn'){const el=$('#lchk');if(el)el.innerHTML=lchk()}}
 if(tab==='panel'){const el=$('#proc');if(el)el.textContent=`Duct ${R.duct.toFixed(2)} inWC | transducer ${E.ai2(C,R).val.toFixed(2)} mA | fan ${R.hz.toFixed(1)} Hz`}},100);
const lab0=k=>E.lab(k,C);
show();draw();

</script>
</body></html>
