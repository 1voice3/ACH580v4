<style>
:root{--bench:#23262a;--tray:#2e3237;--line:#444a51;--ink:#e8eaed;--mut:#a3aab2;--crim:#c02341;--amber:#e0a030;--green:#4cc27d;--cyan:#55bfd2;
--sans:-apple-system,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bench);color:var(--ink);font:16px/1.4 var(--sans)}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.top{padding:calc(8px + env(safe-area-inset-top)) 14px 6px;display:flex;flex-direction:column;gap:2px}.top span{font-size:12px;color:var(--mut)}
.drive{padding:6px 12px}
/* compact strip on non-panel tabs */
.strip{display:none;width:100%;align-items:center;gap:10px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#1c1f22;color:var(--ink);font:600 14px var(--mono);text-align:left;position:sticky;top:0;z-index:5}
body:not([data-view=panel]) .strip{display:flex}body:not([data-view=panel]) .panelwrap{display:none}
.led{display:inline-block;width:14px;height:14px;border-radius:2px;background:#4cc27d;flex:none}
.led.red{background:#e0243f}.led.greenflash{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
/* the panel */
.case{max-width:420px;margin:0 auto;background:linear-gradient(#f4f5f5,#e6e8e8);border-radius:20px;padding:16px 14px 18px;color:#15181a;box-shadow:0 2px 0 #fff inset,0 8px 24px #0008;
 display:grid;grid-template-columns:15% 1fr 17%;grid-template-areas:"led win win" "back dpad ok" "off dpad ah";gap:6px 8px;align-items:center}
.ledcell{grid-area:led;display:flex;justify-content:center}.win{grid-area:win;background:#2c3034;padding:7px;border-radius:6px;box-shadow:inset 0 2px 5px #000a}
.lcd{container-type:inline-size;aspect-ratio:2/1;background:#eef0ee;color:#0e1210;border-radius:2px;padding:2.5cqw 4cqw;font-family:"Helvetica Neue",Arial,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column}
.lcd .ic{width:8cqw;height:8cqw;vertical-align:middle}.lcd .ic.big{width:15cqw;height:15cqw}
.r1{display:flex;align-items:center;gap:3cqw;font-size:8cqw;font-weight:600;line-height:1.1}.tg{margin-left:auto}.tg small{font-size:8cqw;margin-left:1cqw}
.big{font-size:27cqw;line-height:1;font-weight:500;text-align:center;letter-spacing:-.01em;margin-top:2cqw;font-variant-numeric:tabular-nums}.big.ed{font-size:22cqw}
.un{font-size:9cqw;text-align:right;font-weight:600;margin-top:-1cqw;padding-right:20cqw}
.r3{position:absolute;left:4cqw;right:4cqw;bottom:2cqw;display:flex;justify-content:space-between;font-size:7cqw;font-weight:600}.r3 .ic{width:9cqw;height:9cqw}
.msgrow{display:flex;align-items:center;gap:3cqw;margin-top:4cqw;font-size:19cqw;font-weight:500}.msgrow.w{font-size:10cqw;margin-top:12cqw;font-weight:600}.msgrow.w .ic{width:12cqw;height:12cqw}
.rs{position:absolute;right:4cqw;bottom:3cqw;font-size:11cqw;font-weight:600}
.blink{animation:blink 1s steps(2) infinite}
.ttl{font-size:8cqw;font-weight:700;border-bottom:.8cqw solid #0e1210;padding-bottom:1cqw;margin-bottom:1cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li{display:flex;justify-content:space-between;gap:3cqw;font-size:9cqw;font-weight:600;padding:.4cqw 1.5cqw;line-height:1.25;white-space:nowrap}.li span:first-child{overflow:hidden;text-overflow:ellipsis}.li.sel{background:#0e1210;color:#eef0ee}
.evn{font-size:10cqw;font-weight:600;margin-top:5cqw}
.pk{border:0;background:none;color:#15181a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;min-width:48px;font:600 12px var(--sans);touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:10px}
.pk svg{width:28px;height:28px}.pk:active{background:#0002}.pk:focus-visible{outline:3px solid #1b7fd0}
.back{grid-area:back}.ok{grid-area:ok}.off{grid-area:off}.ah{grid-area:ah}.off span{color:#c0182e}.ah span{color:#15781f}
.dpad{grid-area:dpad;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);grid-template-areas:". u ." "l . r" ". d .";justify-items:center;align-items:center;min-height:150px}
.u{grid-area:u}.l{grid-area:l}.r{grid-area:r}.d{grid-area:d}.dpad .pk{min-width:52px;min-height:52px}
.cap{max-width:420px;margin:10px auto 0;font-size:14px;color:var(--ink);min-height:2.8em}.cap b{color:var(--cyan)}
.tray{padding:14px;max-width:760px}
h2{font-size:15px;margin:20px 0 8px;color:var(--cyan);font-weight:600}h2:first-child{margin-top:0}
.tog,.sl,.wr{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line)}
.sl{flex-wrap:wrap}.sl input{width:100%}.tog input{width:26px;height:26px}
select,input[type=number],input[type=search],textarea{background:#1c1f22;color:var(--ink);border:1px solid var(--line);border-radius:4px;font:16px var(--sans);padding:8px;min-height:44px}
select{max-width:60%}textarea{width:100%;min-height:90px;font:12px var(--mono)}
button.btn{min-height:44px;padding:0 14px;margin:4px 6px 4px 0;border-radius:4px;border:1px solid var(--line);background:#3a4047;color:var(--ink);font:600 14px var(--sans)}
.hint{color:var(--mut);font-size:13px}.on{color:var(--green)}.off2{color:var(--mut)}.bad{color:#ff8a9a}
.sig{font-family:var(--mono);font-size:13px;padding:4px 0}
.item{padding:10px 0;border-bottom:1px solid var(--line)}.item b{font-weight:600}
.tag{font:600 11px var(--sans);padding:2px 6px;border-radius:3px;border:1px solid var(--mut);color:var(--mut);margin-left:6px}
.tag.live{border-color:var(--green);color:var(--green)}.tag.fault{border-color:var(--crim);color:#ff8a9a}.tag.warning{border-color:var(--amber);color:var(--amber)}
.pr{display:flex;justify-content:space-between;gap:10px;align-items:center}.pr input,.pr select{width:42%;max-width:42%}
details{margin-top:12px}summary{min-height:44px;display:flex;align-items:center;color:var(--cyan);font-weight:600}
.tt{width:100%;border-collapse:collapse;font:12px var(--mono)}.tt td{padding:3px 6px;border-bottom:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#1a1c1f;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:56px;border:0;background:none;color:var(--mut);font:600 13px var(--sans)}.tabs button.sel{color:#fff;box-shadow:inset 0 3px 0 var(--crim)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
@media(min-width:900px){main{display:grid;grid-template-columns:460px 1fr;align-items:start}.drive{position:sticky;top:0}
 body .strip{display:none!important}body .panelwrap{display:block!important}}
@media(prefers-reduced-motion:reduce){.blink,.led.greenflash{animation:none!important}}
.lcd>*{flex-shrink:0}.li{font-size:8cqw;line-height:1.2}.ttl{font-size:7cqw}

.lcd .li .t{display:flex;align-items:center;gap:2cqw;overflow:hidden;white-space:nowrap}.lcd .li .ic{width:8cqw;height:8cqw;flex:none}.lcd .ttl{display:flex;align-items:center;gap:2cqw}.lcd .ttl .ic{width:8cqw;height:8cqw}
.lcd .dr{font-size:5cqw;font-weight:600;margin-left:-1cqw}.lcd .r3 .sk{display:flex;align-items:center;gap:1.5cqw}.lcd .r3 small{font-size:5cqw;font-weight:600}
.lg{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}.lcdi{background:#eef0ee;color:#0e1210;border-radius:3px;padding:3px;display:inline-flex}.lcdi svg{width:26px;height:26px}
.lcd{--lcdbg:#eef0ee}.lcd .li.sel{--lcdbg:#0e1210}.lcd .un{text-align:center;padding-right:0}

.led.off{background:#555}
.note{margin-top:6px;padding:6px 8px;border-left:3px solid var(--amber);background:#2a2d31;color:var(--ink);font-size:13px}
.seg{display:flex;flex-wrap:wrap}.btn.selb{background:var(--crim);border-color:var(--crim);color:#fff}
.mtag{margin:8px 0;padding:10px 12px;border:2px solid #8b8f94;border-radius:6px;background:#d9dcde;color:#15181a;font:600 14px var(--mono);line-height:1.5}.mtag .bhp{display:inline-block;margin-top:4px;padding:2px 8px;background:#ffd84a;border-radius:3px}
.pt{font:12px var(--sans)}.pt th{text-align:left;color:var(--mut);padding:3px 6px;border-bottom:1px solid var(--line)}.pt td{vertical-align:top}

.case{grid-template-columns:24% 1fr 24%;grid-template-areas:"win win win" "skl . skr" "led dpad help" "off dpad hand" ". auto ." ". usb .";background:linear-gradient(#f1f2f1,#dcdfdf)}
.skl{grid-area:skl}.skr{grid-area:skr}.help{grid-area:help}.hand{grid-area:hand}.auto{grid-area:auto;min-height:36px}.usb{grid-area:usb;text-align:center;font:600 10px var(--sans);color:#6a7075;border-top:1px solid #b9bec2;padding-top:4px}
.skey{background:#e9ebeb;border-radius:18px 18px 8px 8px;box-shadow:0 1px 0 #fff inset,0 1px 2px #0004;min-height:40px}.skey svg{width:44px;height:22px}
.win{background:#d9dcdc;border:2px solid #cfd2d2;padding:10px 12px 8px}
.lcd{aspect-ratio:4/3;background:#f4f5f3;border:2.4cqw solid #111;border-radius:1.5cqw;padding:1cqw 1.5cqw}
.lcd .hdr{display:flex;align-items:center;gap:2cqw;font-size:4.6cqw;border-bottom:.5cqw solid #111;padding:.5cqw 1cqw;white-space:nowrap}.hdr .nm{margin:0 auto 0 4cqw}.hdr .ic{width:5.5cqw;height:5.5cqw}
.lcd .row{display:flex;align-items:center;border:.4cqw solid #111;border-radius:.8cqw;margin:1.2cqw 1cqw 0;height:15cqw;position:relative}
.row .lb{flex:1;font-size:4cqw;line-height:1.05;padding:0 1.4cqw}.row .vl{font-size:12cqw;padding-right:3cqw;font-variant-numeric:tabular-nums;font-weight:500}
.row .ar{position:absolute;font-size:3.4cqw;top:50%;transform:translateY(-50%)}.ar.l{left:-1.6cqw}.ar.r{right:-1.6cqw}
.lcd .ftr{position:absolute;left:2.5cqw;right:2.5cqw;bottom:1.2cqw;display:flex;justify-content:space-between;font-size:4cqw;font-weight:700;border-top:.5cqw solid #111;padding-top:.6cqw}
.lcd .r1{font-size:6cqw}.lcd .big{font-size:20cqw}.lcd .li{font-size:6.2cqw}.lcd .ttl{font-size:5.6cqw}.lcd .un{font-size:6cqw}.lcd .r3{font-size:5cqw}.lcd .msgrow{font-size:12cqw}.lcd .evn{font-size:7cqw}
.mref{margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#1c1f22;font-size:14px}.mref mark{background:#e0a030;color:#111;padding:0 2px}.mref a,.mref button{color:var(--cyan);min-height:44px;display:inline-flex;align-items:center;margin-right:14px;background:none;border:0;font:inherit;text-decoration:underline}

 the status of DI1…DI6. Example: 0000000000010011b = DI5, DI2 and DI1 are on, DI3, DI4 and DI6 are off. This parameter is read-only."], "10.02": [420, "Displays the delayed status of digital inputs DI1…DI6. Bits 0…5 reflect the delayed status of DI1…DI6. Example: 0000000000010011b = DI5, DI2 and DI1 are on, DI3, DI4 and DI6 are off. This word is updated only after a 2 ms activation/deactivation delay."], "10.03": [421, "The electrical statuses of the digital inputs can be overridden, 0000h for example, testing purposes. A bit in parameter 10.04 DI forced data is provided for each digital input, and its value is applied whenever the corresponding bit in this parameter is 1."], "10.04": [421, "Allows the data value of a forced digital input to be changed from 0 to 1. It is only possible to force an input that has been selected in parameter 10.03 DI force selection. Bit 0 is the forced value for DI1; bit 5 is the forced value for the DI6."], "10.05": [422, "Defines the activation delay for digital input DI1. *DI status tOn tOff tOn"], "10.06": [422, "Defines the deactivation delay for digital input DI1. See parameter 10.05 DI1 ON delay."], "10.07": [422, "Defines the activation delay for digital input DI2. *DI status tOn tOff tOn"], "10.08": [422, "Defines the deactivation delay for digital input DI2. See parameter 10.07 DI2 ON delay."], "10.09": [423, "Defines the activation delay for digital input DI3. tOn tOff tOn"], "10.10": [423, "Defines the deactivation delay for digital input DI3. See parameter 10.09 DI3 ON delay."], "10.11": [423, "Defines the activation delay for digital input DI4. tOn tOff tOn"], "10.12": [423, "Defines the deactivation delay for digital input DI4. See parameter 10.11 DI4 ON delay."], "10.13": [424, "Defines the activation delay for digital input DI5. *DI status tOn tOff tOn"], "10.14": [424, "Defines the deactivation delay for digital input DI5. See parameter 10.13 DI5 ON delay."], "10.15": [424, "Defines the activation delay for digital in feed a constant current to a temperature sensor."], "15.34": [453, "Defines the real value of the signal (selected by parameter 15.33 Freq out 1 source) that corresponds to the minimum value of frequency output 1 (defined by parameter 15.36 Freq out 1 at src min). This applies when 15.22 DO1 configuration is set to Frequency output."], "15.35": [453, "Defines the real value of the signal (selected by parameter 15.33 Freq out 1 source) that corresponds to the maximum value of frequency output 1 (defined by parameter 15.37 Freq out 1 at src max). This applies when 15.22 DO1 configuration is set to Frequency output."], "15.36": [453, "Defines the minimum output value of frequency output 1 when 15.22 DO1 configuration is set to Frequency output."], "15.37": [453, "Defines the maximum value of frequency output 1 when 15.22 DO1 configuration is set to Frequency output."], "15.40": [454, "The true readings of the analog inputs can be overridden for example for testing purposes. A forced value parameter is provided for each analog input, and its value is applied whenever the corresponding bit in this parameter is 1."], "15.41": [454, "Selects how the drive reacts when an analog input signal moves out of the minimum and/or maximum limits specified for the input. The inputs and the limits to be observed are selected by parameter 15.42 AI supervision selection. Note: This parameter is visible when CAIO-01 is selected in parameter 15.01."], "15.42": [454, "Specifies the analog input limits to be supervised. See parameter 15.43 AI supervision function. Note: This parameter is visible when CAIO-01 is selected in parameter 15.01."], "15.43": [455, "Activates/deactivate the Analog Input supervision for each control location (EXT1, EXT2, Local)."], "15.51": [456, "Displays the value of analog input AI3 in mA or V mode (depending on whether the input is set to current or voltage in 15.55 AI3 unit selection). This parameter is read-only."], "15.52": [456, "Displays the value of analog input AI3 after scaling. See parameters 15.59 AI3 scaled at AI3 min and 15.60 AI3 scaled at AI3 max. This parameter is read-only."], "15.53": [456, "Value of analog input AI3 in percent of AI3 scaling. Where - 110% = -11V or -22mA and 110% = 11V or 22mA."], "15.54": [456, "Forced value that can be used instead of the true reading of the input. See parameter 15.40 AI force selection."], "15.55": [456, "Selects the unit for readings and settings related to analog input AI3. Note: This parameter is visible when CAIO-01 is selected in parameter 15.01."], "15.56": [457, "Defines the filter time constant for analog input AI3. O = I × (1 - e-t/T) I = filter input (step) O = filter output t = time T = filter time constant Note: The signal is also filtered due to the signal interface hardware (approximately 0.22 ms time constant). This cannot be changed by any parameter."], "15.57": [457, "Defines the minimum value for analog input AI3. Set the value actually sent to the drive when the analog signal is wound to its minimum setting. See also parameter 15.59 AI3 scaled at AI3 min."], "15.58": [457, "Defines the maximum value for analog input AI3. Set the value actually sent to the drive when the analog signal is wound to its maximum setting. See also parameter 15.60 AI3 scaled at AI3 max."], "15.59": [457, "Defines the real internal value that corresponds to the minimum analog input AI3 value defined by parameter 15.57 AI3 min."], "15.60": [457, "Defines the real internal value that corresponds to the maximum analog input AI3 value defined by parameter 15.58 AI3 scaled at AI3 max."], "15.61": [458, "Displays the value of analog input AI4 in mA or V mode (depending on whether the input is set to current or voltage in parameter 15.65 AI4 unit selection). This parameter is read-only."], "15.62": [458, "Displays the value of analog input AI4 after scaling. See parameters 15.69 AI4 scaled at AI4 min and 15.70 AI4 scaled at AI4 max. This parameter is read-only."], "15.63": [458, "Value of analog input AI4 in percent of AI4 scaling. Where - 110% = -11 V or -22 mA and 110% = 11 V or 22 mA."], "15.64": [458, "Forced value that can be used instead of the true reading of the input. See parameter 15.40 AI force selection."], "15.65": [458, "Selects the unit for readings and settings related to analog input AI4. Note: This parameter is visible when CAIO-01 is selected in parameter 15.01."], "15.66": [459, "Defines the filter time constant for analog input AI4. O = I × (1 - e-t/T) I = filter input (step) O = filter output t = time T = filter time constant Note: The signal is also filtered due to the signal interface hardware (approximately 0.22 ms time constant). This cannot be changed by any parameter."], "15.67": [459, "Defines the minimum value for analog input AI4. Set the value actually sent to the drive when the analog signal is wound to its minimum setting. See also parameter 15.69 AI4 scaled at AI4 min."], "15.68": [459, "Defines the maximum value for analog input AI4. Set the value actually sent to the drive when the analog signal is wound to its maximum setting. See also parameter 15.70 AI4 scaled at AI4 max."], "15.69": [459, "Defines the real internal value that corresponds to the minimum analog input AI4 value defined by parameter 15.67 AI4 min."], "15.70": [459, "Defines the real internal value that corresponds to the maximum analog input AI4 value defined by parameter 15.68 AI4 max."], "15.71": [460, "Displays the value of analog input AI5 in mA or V mode (depending on whether the input is set to current or voltage in parameter 15.75 AI5 unit selection). This parameter is read-only."], "15.72": [460, "Displays the value of analog input AI5 after scaling. See parameters 15.79 AI5 scaled at AI5 min and 15.80 AI5 scaled at AI5 max. This parameter is read-only."], "15.73": [460, "Value of analog input AI5 in percent of AI5 scaling. Where - 110% = -11 V or -22 mA and 110% = 11 V or 22 mA."], "15.74": [460, "Forced value that can be used instead of the true reading of the input. See parameter 15.40 AI force selection."], "15.75": [460, "Selects the unit for readings and settings related to analog input AI5. Note: This parameter is visible when CAIO-01 is selected in parameter 15.01."], "15.76": [461, "Defines the filter time constant for analog input AI5. O = I × (1 - e-t/T) I = filter input (step) O = filter output t = time T = filter time constant Note: The signal is also filtered due to the signal interface hardware (approximately 0.22 ms time constant). This cannot be changed by any parameter."], "15.77": [461, "Defines the minimum value for analog input AI5. Set the value actually sent to the drive when the analog signal is wound to its minimum setting. See also parameter 15.79 AI5 scaled at AI5 min."], "15.78": [461, "Defines the maximum value for analog input AI5. Set the value actually sent to the drive when the analog signal is wound to its maximum setting. See also parameter 15.80 AI5 scaled at AI5 max."], "15.79": [461, "Defines the real internal value that corresponds to the minimum analog input AI5 value defined by parameter 15.77 AI5 min."], "15.80": [461, "Defines the real internal value that corresponds to the maximum analog input AI5 value defined by parameter 15.78 AI5 max."], "15.81": [462, "Displays the value of AO3 in mA or V. This parameter is read- - only."], "15.82": [462, "Selects a signal to be connected to analog output AO3. Note: The following selection list depends on the parameters available in the product. If a parameter is not available in the product, then the corresponding list item is also not available/not supported."], "15.83": [463, "Forced value that can be used instead of the selected output signal. See parameter 15.45 AO force selection."], "15.84": [463, "Storage parameter for controlling analog output AO3 for example through the embedded fieldbus interface. In parameter 15.82 AO3 source, select the AO3 data storage. Then set this parameter as the target of the incoming value data."], "15.85": [463, "Selects the unit for readings and settings related to analog input AO3. Note: This parameter is visible when CAIO-01 is selected in parameter 15.01."], "15.86": [463, "Defines the filter time constant for analog output AO3. O = I × (1 - e-t/T) I = filter input (step) O = filter output t = time T = filter time constant Note: The signal is also filtered due to the signal interface hardware. This cannot be changed by any parameter."], "15.87": [464, "Defines the real minimum value of the signal (selected by parameter 15.82 AO3 source) that corresponds to the minimum required AO3 output value (defined by parameter 15.89 AO3 out at AO3 source min). Programming 15.87 as the maximum value and 15.88 as the minimum value inverts the output as shown below."], "15.88": [464, "Defines the real maximum value of the signal (selected by parameter 15.82 AO3 source) that corresponds to the maximum required AO3 output value (defined by parameter 15.90 AO3 out at AO3 source max). See parameter 15.87 AO3 source min."], "15.89": [464, "Defines the minimum output value for analog output AO3. See also the drawing at parameter 15.87 AO3 source min."], "15.90": [465, "Defines the maximum output value for analog output AO3. See also the drawing at parameter 15.87 AO3 source min."], "15.91": [465, "Displays the value of AO4 in mA or V. This parameter is read- - only."], "15.92": [465, "Selects a signal to be connected to analog output AO4. Note: The following selection list depends on the parameters available in the product. If a parameter is not available in the product, then the corresponding list item is also not available/not supported."], "15.93": [466, "Forced value that can be used instead of the selected output signal. See parameter 15.45 AO force selection."], "15.94": [466, "Storage parameter for controlling analog output AO4 for example through the embedded fieldbus interface. In parameter 15.92 AO4 source, select the AO4 data storage. Then set this parameter as the target of the incoming value data."], "15.95": [466, "Selects the unit for readings and settings related to analog input AO4. Note: This parameter is visible when CAIO-01 is selected in parameter 15.01."], "15.96": [466, "Defines the filter time constant for analog output AO4. O = I × (1 - e-t/T) I = filter input (step) O = filter output t = time T = filter time constant Note: The signal is also filtered due to the signal interface hardware. This cannot be changed by any parameter."], "15.97": [467, "Defines the real minimum value of the signal (selected by parameter 15.92 AO4 source) that corresponds to the minimum required AO4 output value (defined by parameter 15.99 AO4 out at AO4 source min). Programming 15.97 as the maximum value and 15.98 as the minimum value inverts the output as shown below."], "15.98": [467, "Defines the real maximum value of the signal (selected by parameter 15.92 AO4 source) that corresponds to the maximum required AO4 output value (defined by parameter 15.100 AO4 out at AO4 source max). See parameter 15.97 AO4 source min."], "15.99": [467, "Defines the minimum output value for analog output AO4. See also drawing at parameter 15.97 AO4 source min."], "19.01": [468, "Displays the operating mode currently used. Note: This parameter is read-only."], "19.11": [468, "Selects the source for external control location EXT1/EXT2 selection."], "19.18": [469, "Selects the source for Hand/Off disable. 1 = Hand and/or Off buttons are disabled on the control panel and in Drive composer PC tool. Parameter 19.19 HAND/OFF disable action specifies which buttons are disabled or enabled."], "19.19": [469, "Selects which buttons are disabled on the control panel and in the Drive composer PC tool when parameter 19.18 HAND/OFF disable source is disabled."], "20.03": [472, "Selects source 1 for parameter 20.01 Ext1 commands. 0."], "20.04": [472, "Selects source 2 for parameter 20.01 Ext1 commands. For the available selections, see parameter 20.03 Ext1 in1 source."], "20.05": [472, "Selects source 3 for parameter 20.01 Ext1 commands. For the available selections, see parameter 20.03 Ext1 in1 source."], "20.06": [472, "Selects the source of start, stop and direction commands for external control location 2 (EXT2). See parameter 20.21 for the determination of the actual direction. See also parameters 20.07…20.10."], "20.07": [474, "Defines whether the start signal for external control location EXT2 is edge-triggered or level-triggered. Note: If a pulse type start signal is selected, this parameter is only effective at drive startup. See the descriptions of the selections of parameter 20.06 Ext2 commands. The start signal is edge-triggered."], "20.08": [475, "Selects source 1 for parameter 20.06 Ext2 commands. For the available selections, see parameter 20.03 Ext1 in1 source."], "20.09": [475, "Selects source 2 for parameter 20.06 Ext2 commands. For the available selections, see parameter 20.03 Ext1 in1 source."], "20.10": [475, "Selects source 3 for parameter 20.06 Ext2 commands. For the available selections, see parameter 20.03 Ext1 in1 source."], "20.21": [475, "Reference direction lock. Defines the direction of the drive rather than the sign of the reference, except in some cases. In the table the actual drive rotation is shown as a function of parameter 20.21 Direction and Direction command (from parameter 20.01 Ext1 commands or 20.06 Ext2 commands)."], "20.30": [476, "Selects enable signal warnings to be suppressed. This parameter can be used to prevent these warnings from flooding the event log. Whenever a bit of this parameter is set to 1, the corresponding warning is suppressed. Name Description Run permissive 1 = Warning AFED Run permissive is suppressed."], "20.40": [476, "Selects the source of the Run permissive signal. Value 0 of the source deactivates the Run permissive and prevents running. Value 1 of the source activates the Run permissive and permits running. Note: Removal of the Run permissive setting when the drive is running results in a Coast Stop condition."], "20.41": [477, "Selects the source of the Start interlock 1 signal. Value 0 of the source deactivates the Start interlock 1 signal and inhibits starting. Value 1 of the source activates the Start interlock 1 signal and allows starting."], "20.42": [477, "Selects the source of the Start interlock 2 signal. For the selections, see parameter 20.41 Start interlock 1."], "20.43": [477, "Selects the source of the Start interlock 3 signal. Start interlock 3 is not supported over the Fieldbus adapter or Embedded fieldbus."], "20.44": [477, "Selects the source of the Start interlock 4 signal. Start interlock 4 is not supported over the Fieldbus adapter or Embedded fieldbus."], "20.45": [477, "Follows motor stop mode selection, see parameter 21.03 Stop mode. Not in use."], "20.46": [478, "Alternative alarm texts for the run permissive. There is also label text (free text) for the run permissive. The control panel display will display the text when the run permissive becomes unsatisfied."], "20.47": [478, "Alternative alarm texts for the start interlock 1. There is also label text (free text) for each start interlock. The control panel display will display that specific text when the interlock becomes unsatisfied."], "20.48": [478, "Alternative alarm texts for the start interlock 2. See parameter 20.47 Start interlock 1 text."], "20.49": [478, "Alternative alarm texts for the start interlock 3. See parameter 20.47 Start interlock 1 text."], "20.50": [478, "Alternative alarm texts for the start interlock 4. See parameter 20.47 Start interlock 1 text."], "20.51": [479, "Selects the condition for start interlock function. This parameter determines if the start command is needed before start interlock warnings are displayed. Start interlock warnings are displayed if the interlocks are missing."], "21.01": [479, "Selects the motor start function for the vector motor control mode, ie, when 99.04 Motor control mode is set to Vector. Notes: • The start function for the scalar motor control mode is selected by parameter 21.19 Scalar start mode."], "21.02": [480, "Defines the pre-magnetization time when • parameter 21.01 Start mode is set to Const time (in vector motor control mode), or • parameter 21.19 Scalar start mode is set to Const time (in scalar motor control mode). After the start command, the drive automatically premagnetizes the motor for the set time."], "21.03": [480, "Selects the way the motor is stopped when a stop command is received. Additional braking is possible by selecting flux braking (see parameter 97.05 Flux braking)."], "21.04": [480, "Selects the way the motor is stopped when an emergency stop command is received. The source of the emergency stop signal is selected by parameter 21.05 Emergency stop source."], "21.05": [481, "Selects the source of the emergency stop signal. The stop Inactive mode is selected by parameter 21.04 Emergency stop mode. (true) 0 = Emergency stop active 1 = Normal operation Note: This parameter cannot be changed while the drive is running."], "21.06": [481, "Defines the zero speed limit. The motor is stopped along a speed ramp (when ramped stop is selected or emergency stop time is used) until the defined zero speed limit is reached."], "21.07": [482, "Defines the delay for the zero speed delay function. The function is useful in applications where a smooth and quick restarting is essential. During the delay, the drive knows the rotor position accurately. Without zero speed delay: The drive receives a stop command and decelerates along a ramp."], "21.08": [483, "Activates/deactivates the DC hold and post-magnetization functions. See section Start methods – DC magnetization (page 198). Note: DC magnetization causes the motor to heat up. In applications where long DC magnetization times are required, externally ventilated motors should be used."], "21.09": [483, "Defines the DC hold speed in speed control mode. See parameter 21.08 DC current control, and section DC hold (page 199)."], "21.10": [483, "Defines the DC hold current in percent of the motor nominal current. See parameter 21.08 DC current control, and section Start methods – DC magnetization (page 198)."], "21.11": [483, "Defines the length of time for which post-magnetization is active after stopping the motor. The magnetization current is defined by parameter 21.10 DC current reference."], "21.13": [484, "Selects the way autophasing is performed in start. See section Autophasing on page 195. Notes: • This parameter can only be used for PM or synchronous motors. • This parameter cannot be changed while the drive is running."], "21.14": [484, "Selects the source for controlling pre-heating for the motor. The status of the pre-heating is shown as bit 2 of 06.21 Drive status word 3. Notes: • The heating function requires that STO is not triggered. • The heating function requires that the drive is not faulted. 0. Pre-heating is always deactivated. 1."], "21.15": [485, "Time delay before pre-heating starts after the drive is stopped."], "21.16": [485, "percent of the nominal motor current."], "21.21": [487, "Defines the DC hold frequency, which is used instead of parameter 21.09 DC hold speed when the motor is in scalar frequency mode."], "21.22": [487, "Defines the start delay. After the conditions for start have been fulfilled, the drive waits until the delay has elapsed and then starts the motor. During the delay, warning AFE9 Start delay is shown."], "21.23": [487, "Selects the forced current vector rotation mode at low speeds. When the smooth start mode is selected, the rate of acceleration is limited by the acceleration and deceleration ramp times. If the process driven by the permanent magnet synchronous motor has high inertia, slow ramp times are recommended."], "21.24": [487, "Current used in the current vector rotation at low speeds. Increase the smooth start current if the application requires motor shaft swinging needs to be minimized. Note that accurate torque control is not possible in the current vector rotation mode."], "21.25": [487, "used. See parameter 21.19 Scalar start mode. Can be used for permanent magnet synchronous motors only."], "21.26": [487, "Defines the maximum supplied current to motor when (21.19 Scalar start mode is set to Torque boost (see page 486). Parameter value is in percent of the motor nominal current. Nominal value of the parameter is 100.0%."], "21.27": [487, "Defines the minimum and maximum torque boost time. If torque boost time is less than 40% of frequency acceleration time (see parameters 28.72 and 28.74), then torque boost time is set at 40% of frequency acceleration time. Nominal motor time."], "21.30": [488, "Selects the method used to stop the drive. Speed compensated stop is active only if • the operation mode is not torque, and • parameter 21.03 Stop mode is Ramp."], "21.31": [488, "This delay adds distance to the total distance traveled during a stop from maximum speed."], "21.32": [488, "This parameter sets a speed threshold below which the Speed compensated stop feature is disabled."], "21.34": [488, "Forces automatic restart. The parameter is applicable only if parameter 95.04 Control board supply is set to External 24V. Force auto restart disabled."], "21.35": [488, "Defines the power used to heat the motor."], "21.36": [488, "Defines if preheating is specified as current or power. Preheating specified as current (see parameter 21.16)."], "21.40": [489, "Defines the restart delay for compressor short cycle protection. The compressor cannot be restarted within the set restart delay time. Restart delay is not applicable to the first start after drive power on."], "21.41": [489, "Defines the minimum run time for a compressor short cycle protection. The compressor cannot be stopped within the set minimum run time except via an emergency stop."], "22.11": [490, "Selects EXT1 speed reference source 1. Two signal sources can be defined by this parameter and 22.12 Ext1 speed ref2. A mathematical function (22.13 Ext1 speed function) applied to the two signals creates an EXT1 reference (A in the figure below)."], "22.12": [491, "Selects EXT1 speed reference source 2. For the available selections, and a diagram of reference source selection, see parameter 22.11 Ext1 speed ref1."], "22.13": [491, "Selects a mathematical function between the reference sources selected by parameters 22.11 Ext1 speed ref1 and 22.12 Ext1 speed ref2. See diagram at 22.11 Ext1 speed ref1."], "22.18": [492, "Selects EXT2 speed reference source 1. Two signal sources can be defined by this parameter and 22.19 Ext2 speed ref2. A mathematical function (22.20 Ext2 speed function) applied to the two signals creates an EXT2 reference. See diagram at 28.11 Ext1 frequency ref1. None. 12.12 AI1 scaled value (see page 434)."], "22.19": [493, "Selects EXT2 speed reference source 2. For the selections, and a diagram of reference source selection, see parameter 22.18 Ext2 speed ref1."], "22.20": [493, "Selects a mathematical function between the reference sources selected by parameters 22.18 Ext2 speed ref1 and 22.19 Ext2 speed ref2. See diagram at 22.18 Ext2 speed ref1. Signal selected by Ext2 speed ref1 is used as speed reference 1 as such (no function applied)."], "22.21": [493, "Determines how constant speeds are selected, and whether the rotation direction signal is considered or not when applying a constant speed. Information defined by parameters 22.22, 22.23 and 22.24."], "22.22": [494, "When bit 0 of parameter 22.21 Constant speed function is 0 (Separate), selects a source that activates constant speed 1."], "22.23": [494, "When bit 0 of parameter 22.21 Constant speed function is 0 (Separate), selects a source that activates constant speed 2."], "22.24": [495, "When bit 0 of parameter 22.21 Constant speed function is 0 Always off (Separate), selects a source that activates constant speed 3."], "22.25": [495, "When bit 0 of parameter 22.21 Constant speed function is 0 Always off (Separate), selects a source that activates constant speed 4."], "22.26": [495, "Defines constant speed 1 (the speed the motor will turn when constant speed 1 is selected)."], "22.27": [495, "Defines constant speed 2."], "22.28": [495, "Defines constant speed 3."], "22.29": [495, "Defines constant speed 4."], "22.30": [495, "Defines constant speed 5."], "22.41": [496, "Defines a safe speed reference value that is used with supervision functions such as • 12.03 AI supervision function • 49.05 Communication loss action • 50.02 FBA A comm loss func • 80.17 Maximum flow protection • 80.18 Minimum flow protection."], "22.46": [496, "When bit 0 of parameter 22.21 Constant speed function is 0 (Separate), selects a source that activates constant speed 5."], "22.47": [496, "When bit 0 of parameter 22.21 Constant speed function is 0 (Separate), selects a source that activates constant speed 6."], "22.51": [496, "Enables/disables the critical speeds function. Also determines whether the specified ranges are effective in both rotating directions or not. See also section Critical speeds/frequencies (page 160). Information 1 = Enable: Critical speeds enabled. 0 = Disable: Critical speeds disabled."], "22.52": [496, "Note: This value must be less than or equal to the value of 22.53 Critical speed 1 high."], "22.53": [496, "Defines the high limit for critical speed range 1. Note: This value must be greater than or equal to the value of 22.52 Critical speed 1 low."], "22.54": [496, "Note: This value must be less than or equal to the value of 22.55 Critical speed 2 high."], "22.55": [496, "Defines the high limit for critical speed range 2. Note: This value must be greater than or equal to the value of 22.54 Critical speed 2 low."], "22.56": [497, "Note: This value must be less than or equal to the value of 22.57 Critical speed 3 high."], "22.57": [497, "Defines the high limit for critical speed range 3. Note: This value must be greater than or equal to the value of 22.56 Critical speed 3 low."], "22.71": [497, "Activates and selects the mode of the Floating point control (Motor potentiometer). Floating point control (Motor potentiometer) is disabled and the Floating point control (Motor potentiometer) counter value set to 0."], "22.72": [497, "Defines an initial value (starting point) for the Floating point control (Motor potentiometer) counter."], "22.73": [498, "Selects the source of Floating point control (Motor potentiometer) counter up signal. 0 = No change 1 = Increase Floating point control (Motor potentiometer) counter value."], "22.74": [498, "Selects the source of Floating point control (Motor potentiometer) counter down signal. 0 = No change 1 = Decrease Floating point control (Motor potentiometer) counter value."], "22.75": [498, "Defines the change rate of the Floating point control (Motor potentiometer) counter. This parameter specifies the time required for the Floating point control (Motor potentiometer) to change from minimum (22.76) to maximum (22.77)."], "22.76": [499, "Defines the minimum value of the Floating point control (Motor potentiometer) counter."], "22.77": [499, "Defines the maximum value of the Floating point control (Motor potentiometer) counter."], "22.80": [499, "The output of the Floating point control (Motor potentiometer) function."], "22.86": [499, "Displays the value of the speed reference (EXT1 or EXT2) that has been selected by 19.11 Ext1/Ext2 selection. See diagram at 22.11 Ext1 speed ref1 or control chain diagram Speed reference source selection I on page 366."], "23.01": [499, "Displays the used speed reference (in rpm) before it enters - the ramping and shaping functions. See control chain diagram Speed reference ramping and shaping on page 368."], "23.11": [500, "Selects the source that switches between the two sets of acceleration/deceleration ramp times defined by parameters 23.12…23.15."], "23.12": [500, "Defines acceleration time 1 as the time required for the speed to change from zero to the speed defined by parameter 46.01 Speed scaling (not to parameter 30.12 Maximum speed). If the speed reference increases faster than the set acceleration rate, the motor speed will follow the acceleration rate."], "23.13": [500, "to change from the speed defined by parameter 46.01 Speed scaling (not from parameter 30.12 Maximum speed) to zero. If the speed reference decreases slower than the set deceleration rate, the motor speed will follow the reference."], "23.23": [501, "Defines the time inside which the drive is stopped if an emergency stop Off3 is activated (ie. the time required for the speed to change from the speed value defined by parameter 46.01 Speed scaling or 46.02 Frequency scaling to zero)."], "23.28": [501, "Activates the variable slope function, which controls the slope of the speed ramp during a speed reference change. This allows for a constantly variable ramp rate to be generated, instead of just the standard two ramps normally available."], "23.29": [502, "Defines the rate of the speed reference change when variable slope is enabled by parameter 23.28 Variable slope enable."], "24.01": [502, "Displays the ramped and corrected speed reference (before speed error calculation). See control chain diagram Speed error calculation on page 369."], "24.02": [502, "Displays the speed feedback used for speed error calculation. See control chain diagram Speed error calculation on page 369."], "24.03": [502, "Speed error calculation on page 369. This parameter is read-only."], "24.04": [502, "Displays the inverted (unfiltered) speed error. See control chain diagram Speed error calculation on page 369."], "24.11": [502, "Defines a speed reference correction, ie, a value added to the existing reference between ramping and limitation. This is useful to trim the speed if necessary, for example, to adjust draw between sections of a paper machine."], "24.12": [502, "Defines the time constant of the speed error low-pass filter. If the used speed reference changes rapidly, the possible interferences in the speed measurement can be filtered with the speed error filter. Reducing the ripple with this filter may cause speed controller tuning problems."], "25.01": [503, "Displays the speed controller output that is transferred to the torque controller. See control chain diagram Speed error calculation on page 369."], "25.02": [503, "Defines the proportional gain (Kp) of the speed controller. Too high a gain may cause speed oscillation. The figure below shows the speed controller output after an error step when the error remains constant."], "25.03": [504, "Defines the integration time of the speed controller. The integration time defines the rate at which the controller output changes when the error value is constant and the proportional gain of the speed controller is 1. The shorter the integration time, the faster the continuous error value is corrected."], "25.04": [505, "Defines the derivation time of the speed controller. Derivative action boosts the controller output if the error value changes. The longer the derivation time, the more the speed controller output is boosted during the change."], "25.05": [505, "Defines the derivation filter time constant. See parameter 25.04 Speed derivation time."], "25.15": [506, "Defines the proportional gain for the speed controller when an emergency stop is active."], "25.30": [507, "Enables/disables speed controller adaptation based on motor flux reference (01.24 Flux actual %). The proportional gain of the speed controller is multiplied by a coefficient of 0…1 between 0…100% flux reference respectively. Speed controller adaptation based on flux reference disabled."], "25.33": [507, "Activates the speed controller autotune function. See section Before activating the autotune routine on page 213."], "25.34": [507, "Defines a control preset for the speed controller autotune function. The setting affects the way the torque reference will respond to a speed reference step."], "25.39": [507, "Defines a speed value added to the initial speed for the autotune function. The initial speed (speed used when autotune is activated) plus the value of this parameter is the calculated maximum speed used by the autotune routine."], "25.40": [507, "Determines how many acceleration/deceleration cycles are performed during the autotune routine."], "25.53": [507, "Displays the output of the proportional (P) part of the speed controller. See control chain diagram Speed error calculation on page 369."], "25.54": [508, "Displays the output of the integral (I) part of the speed controller."], "25.55": [508, "Displays the output of the derivative (D) part of the speed controller. See control chain diagram Speed error calculation on page 369."], "25.56": [508, "Displays the output of the acceleration compensation function. See control chain diagram Speed error calculation on page 369."], "28.01": [508, "Displays the used frequency reference before ramping. See the control chain diagrams Frequency reference selection on page 364 and Frequency reference modification on page 365."], "28.02": [508, "Displays the final frequency reference (after selection, limitation and ramping). See control chain diagram on page 364."], "28.11": [509, "Two signal sources can be defined by this parameter and 28.12 Ext1 frequency ref2. A mathematical function (28.13 Ext1 frequency function) applied to the two signals creates an EXT1 reference (A in the figure below)."], "28.12": [510, "For the available selections, and a diagram of reference source selection, see parameter 28.11 Ext1 frequency ref1."], "28.13": [510, "Selects a mathematical function between the reference sources selected by parameters 28.11 Ext1 frequency ref1 and 28.12 Ext1 frequency ref2. See diagram at 28.11 Ext1 frequency ref1."], "28.15": [511, "Two signal sources can be defined by this parameter and 28.16 Ext2 frequency ref2. A mathematical function (28.17 Ext2 frequency function) applied to the two signals creates an EXT2 reference. See diagram at 28.11 Ext1 frequency ref1. None. 12.12 AI1 scaled value (see page 434)."], "28.16": [512, "For the available selections, and a diagram of reference source selection, see parameter 28.15 Ext2 frequency ref1."], "28.17": [512, "Selects a mathematical function between the reference sources selected by parameters 28.15 Ext2 frequency ref1 and 28.16 Ext2 frequency ref2. See diagram at 28.15 Ext2 frequency ref1. Signal selected by 28.15 Ext2 frequency ref1 is used as frequency reference 1 as such (no function applied)."], "28.21": [512, "Determines how constant frequencies are selected, and whether the rotation direction signal is considered or not when applying a constant frequency. Information 1 = Packed: 7 constant frequencies are selectable using the three sources defined by parameters 28.22, 28.23 and 28.24."], "28.22": [513, "0 (Separate), selects a source that activates constant frequency 1."], "28.23": [513, "0 (Separate), selects a source that activates constant frequency 2. When bit 0 of parameter 28.21 Constant frequency function is 1 (Packed), this parameter and parameters 28.22 Constant frequency sel1 and 28.24 Constant frequency sel3 select three sources that are used to activate constant frequencies."], "28.24": [514, "0 (Separate), selects a source that activates constant frequency 3. When bit 0 of parameter 28.21 Constant frequency function is 1 (Packed), this parameter and parameters 28.22 Constant frequency sel1 and 28.23 Constant frequency sel2 select three sources that are used to activate constant frequencies."], "28.25": [514, "0 (Separate), selects a source that activates constant frequency 4."], "28.26": [514, "Defines constant frequency 1 (the frequency the motor will turn when constant frequency 1 is selected)."], "28.27": [514, ""], "28.28": [514, "Defines constant frequency 3."], "28.29": [513, "Defines constant frequency 4."], "28.30": [514, "Defines constant frequency 5."], "28.31": [514, "Defines constant frequency 6."], "28.32": [514, "Defines constant frequency 7."], "28.41": [515, "Defines a safe frequency reference value that is used with supervision functions such as • 12.03 AI supervision function • 49.05 Communication loss action • 50.02 FBA A comm loss func."], "28.46": [515, "0 (Separate), selects a source that activates constant frequency 5."], "28.47": [515, "0 (Separate), selects a source that activates constant frequency 6."], "28.51": [515, "Enables/disables the critical frequencies function. Also determines whether the specified ranges are effective in both rotating directions or not. See also section Critical speeds/frequencies (page 160). Information 1 = Enable: Critical frequencies enabled. 0 = Disable: Critical frequencies disabled."], "28.52": [515, "Defines the low limit for critical frequency 1. Note: This value must be less than or equal to the value of 28.53 Critical frequency 1 high."], "28.53": [515, "Defines the high limit for critical frequency 1. Note: This value must be greater than or equal to the value of"], "28.54": [515, "Defines the low limit for critical frequency 2. Note: This value must be less than or equal to the value of 28.55 Critical frequency 2 high."], "28.55": [516, "Defines the high limit for critical frequency 2. Note: This value must be greater than or equal to the value of 28.54 Critical frequency 2 low."], "28.56": [516, "Defines the low limit for critical frequency 3. Note: This value must be less than or equal to the value of 28.57 Critical frequency 3 high."], "28.57": [516, "Defines the high limit for critical frequency 3. Note: This value must be greater than or equal to the value of 28.56 Critical frequency 3 low."], "28.71": [516, "Selects a source that switches between the two sets of acceleration/deceleration times defined by parameters 28.72…28.75."], "28.72": [516, "Defines acceleration time 1 as the time required for the frequency to change from zero to the frequency defined by parameter 46.02 Frequency scaling. After this frequency has been reached, the acceleration continues with the same rate to the value defined by parameter 30.14 Maximum frequency."], "28.73": [517, "Defines deceleration time 1 as the time required for the frequency to change from the frequency defined by parameter 46.02 Frequency scaling (not from parameter 30.14 Maximum frequency) to zero."], "28.74": [517, "Defines acceleration time 2. See parameter 28.72 Freq acceleration time 1."], "28.75": [517, "Defines deceleration time 2. See parameter 28.73 Freq deceleration time 1."], "28.76": [517, "Selects a source that forces the frequency reference to zero. 0 = Force frequency reference to zero 1 = Normal operation 0."], "28.92": [517, "parameter 28.13 Ext1 frequency function (if any), and after selection (19.11 Ext1/Ext2 selection). See control chain diagram Frequency reference selection on page 364."], "28.96": [517, "frequencies, control panel reference, etc. See control chain diagram Frequency reference selection on page 364."], "28.97": [518, "Displays the frequency reference after application of critical frequencies, but before ramping and limiting. See control chain diagram Frequency reference modification on page 365."], "30.01": [518, "Displays limit word 1. This parameter is read-only. Description 1 = Drive torque is being limited by the motor control (undervoltage control, current control, load angle control or pull-out control), or by the torque limits defined by parameters."], "30.02": [519, "Displays the torque controller limitation status word. This parameter is read-only."], "30.11": [520, "Defines together with 30.12 Maximum speed the allowed speed range. See the figure below. A positive or zero minimum speed value defines two ranges, one positive and one negative. A negative minimum speed value defines one range."], "30.12": [520, "Defines together with 30.11 Minimum speed the allowed speed range. See parameter 30.11 Minimum speed. Note: This parameter does not affect the speed acceleration and deceleration ramp times."], "30.13": [521, "Defines together with 30.14 Maximum frequency the allowed frequency range. See the figure. A positive or zero minimum frequency value defines two ranges, one positive and one negative. WARNING! The absolute value of 30.13 Minimum frequency must not be higher than the absolute value of 30.14 Maximum frequency."], "30.14": [521, "Defines together with 30.13 Minimum frequency the allowed frequency range. See parameter 30.13 Minimum frequency. Note: This parameter does not affect the frequency acceleration and deceleration ramp times."], "30.15": [521, "A temporary motor current limit specifically for starting can be defined by this parameter and 30.16 Maximum start current. When this parameter is set to Enable, the drive observes the start current limit defined by 30.16 Maximum start current."], "30.16": [521, "Defines a maximum start current when enabled by parameter 30.15 Maximum start current enable."], "30.17": [522, "Defines the maximum allowed motor current. This depends on the drive type; it is automatically determined on the basis of the rating."], "30.18": [522, "Selects a source that switches between two different predefined minimum torque limit sets."], "30.19": [523, "Defines a minimum torque limit for the drive (in percent of nominal motor torque). See diagram at parameter 30.18 Torque limit selection. The limit is effective when • the source selected by 30.18 Torque limit selection is 0, or • 30.18 is set to Torque limit set 1."], "30.20": [523, "Defines a maximum torque limit for the drive (in percent of nominal motor torque). See diagram at parameter 30.18 Torque limit selection."], "30.21": [523, "Defines the source of the minimum torque limit for the drive (in percent of nominal motor torque) when • the source selected by parameter 30.18 Torque limit selection is 1, or • 30.18 is set to Torque limit set 2. See diagram at 30.18 Torque limit selection."], "30.22": [523, "Defines the source of the maximum torque limit for the drive (in percent of nominal motor torque) when • the source selected by parameter 30.18 Torque limit selection is 1, or • 30.18 is set to Torque limit set 2. See diagram at 30.18 Torque limit selection."], "30.23": [524, "Defines the minimum torque limit for the drive (in percent of nominal motor torque) when • the source selected by 30.18 Torque limit selection is 1, or • 30.18 is set to Torque limit set 2 and • 30.21 Min torque 2 source is set to Minimum torque 2."], "30.24": [524, "Defines the maximum torque limit for the drive (in percent of nominal motor torque) when The limit is effective when • the source selected by 30.18 Torque limit selection is 1, or • 30.18 is set to Torque limit set 2 and • 30.22 Max torque 2 source is set to Maximum torque 2."], "30.26": [524, "Defines the maximum allowed power fed by the inverter to the motor in percent of nominal motor power."], "30.27": [524, "Defines the maximum allowed power fed by the motor to the inverter in percent of nominal motor power."], "30.30": [524, "Fast braking of a high inertia load causes the voltage to rise to the overvoltage control limit. To prevent the DC voltage from exceeding the limit, the overvoltage controller automatically decreases the braking torque."], "30.31": [525, "Enables the undervoltage control of the intermediate DC link. If the DC voltage drops due to input power cut off, the undervoltage controller will automatically decrease the motor torque in order to keep the voltage above the lower limit."], "30.35": [525, "Enables/disables temperature-based output current limitation.The temperature is the measurement of the IGBT module temperature.The limitation should only be disabled if required by the application."], "30.36": [525, "Selects a source that switches between two different predefined adjustable speed limit sets. 0 = minimum speed limit defined by 30.11 and maximum speed limit defined by 30.12 are active 1 = minimum speed limit selected by 30.37 and maximum speed limit defined by 30.38 are active."], "30.37": [526, "Defines the source of a minimum speed limit for the drive when the source is selected by 30.36 Speed limit selection. Note: In vector motor control mode only. In scalar motor control mode, use frequency limits 30.13 and 30.14."], "30.38": [526, "Defines the source of a maximum speed limit for the drive when the source is selected by 30.36 Speed limit selection. Note: In vector motor control mode only. In scalar motor control mode, use frequency limits 30.13 and 30.14. None."], "30.39": [526, "Determines if the limit word 1 (30.01) notifies the user when a trigger event has occurred. See parameters 30.41 and 30.42 for further details."], "30.40": [526, "Sets how long an event needs to last to trigger a warning. The event needs to persist for longer than this duration to trigger a warning."], "30.41": [527, "Determines if a warning message is given based on being enabled or disabled in the table below. If enabled, a warning will be given. If disabled, warnings are ignored."], "31.01": [530, "Defines the source of external event 1. See also parameter 31.02 External event 1 type."], "31.03": [530, "Defines the source of external event 2. See also parameter 31.04 External event 2 type."], "31.04": [530, "Selects the type of external event 2. The external event generates a fault."], "31.05": [530, "Defines the source of external event 3. See also parameter 31.06 External event 3 type."], "31.06": [530, "Selects the type of external event 3. The external event generates a fault."], "31.07": [530, "Defines the source of external event 4. See also parameter 31.08 External event 4 type."], "31.08": [530, "Selects the type of external event 4. The external event generates a fault."], "31.09": [531, "Defines the source of external event 5. See also parameter 31.10 External event 5 type."], "31.10": [531, "source. Selects the type of external event 5. The external event generates a fault."], "31.11": [531, "Selects the source of an external fault reset signal. The signal resets the drive after a fault trip if the cause of the fault no longer exists."], "31.12": [532, "Selects faults that are automatically reset. The parameter is a 16-bit word with each bit corresponding to a fault type. Whenever a bit is set to 1, the corresponding fault is automatically reset. Faults marked with an asterisk (*) in the table below will be reset on the inverter unit (INU) and the supply unit (LSU)."], "31.13": [532, "Defines the fault that can be automatically reset using parameter 31.12 Autoreset selection, bit 10. Faults are listed in chapter Fault tracing (page 240)."], "31.14": [532, "Defines the maximum number of automatic resets that the drive is allowed to attempt within the time specified by 31.15 Total trials time. If the fault persists, subsequent reset attempts will be made at intervals defined by 31.16 Delay time."], "31.15": [533, "Defines a time window for automatic fault resets. The maximum number of attempts made during any period of this length is defined by 31.14 Number of trials. Note: If the fault condition remains and cannot be reset, each reset attempt will generate an event and start a new time window."], "31.16": [533, "Defines the time that the drive will wait after a fault before attempting an automatic reset."], "31.19": [533, "Selects how the drive reacts when a motor phase loss is detected. In scalar motor control mode: • The supervision activates above 10% of the motor nominal frequency. If any of the phase currents stays very small for a certain time limit, the output phase loss fault is given."], "31.20": [533, "Selects how the drive reacts when an earth fault or current unbalance is detected in the motor or the motor cable."], "31.21": [533, "Selects how the drive reacts when a supply phase loss is detected."], "31.22": [534, "Selects which indications are given when one or both Safe torque off (STO) signals are switched off or lost. The indications also depend on whether the drive is running or stopped when this occurs. The tables at each selection below show the indications generated with that particular setting."], "31.23": [535, "motor cable connection (ie. input power cable is connected to drive motor connection). Note: For ACH580-31 and ACH580-34 the default value is No action."], "31.24": [536, "Selects how the drive reacts to a motor stall condition. A stall condition is defined as follows: • The drive exceeds the stall current limit (31.25 Stall current limit), and • the output frequency is below the level set by parameter 31.27 Stall frequency limit or the motor speed is below the level set by parameter 31."], "31.25": [536, "Stall current limit in percent of the nominal current of the motor."], "31.26": [536, "Stall speed limit in rpm. See parameter 31.24 Stall function."], "31.27": [536, "Note: Setting the limit below 10 Hz is not recommended."], "31.28": [536, "Stall time. See parameter 31.24 Stall function."], "31.30": [537, "Defines, together with 30.11 Minimum speed and 30.12 500.00 rpm Maximum speed, the maximum allowed speed of the motor (overspeed protection)."], "31.31": [538, "Defines, together with 30.13 Minimum frequency and 30.14 Maximum frequency, the maximum allowed frequency of the motor (overfrequency protection)."], "31.33": [539, "If parameter 31.32 Emergency ramp supervision is set to 0%, this parameter defines the maximum time an emergency stop (mode Off1 or Off3) is allowed to take."], "31.35": [539, "Selects how the drive reacts when a main cooling fan speed problem is detected. For frame sizes R6 or larger only."], "31.36": [539, "Selects how the drive reacts when an auxiliary fan problem is detected. Certain drive types (especially those protected to IP55) have an auxiliary fan built into the front cover as standard."], "31.40": [540, "Selects warnings to be suppressed. This parameter is a 16- bit word with each bit corresponding to a warning. Whenever a bit is set to 1, the corresponding warning is suppressed."], "31.50": [540, "(Only visible for ACH580-07). Defines the warning limit for cabinet temperature."], "31.51": [540, "Cabinet temperature warning limit. (Only visible for ACH580-07). Defines the fault limit for cabinet temperature. When the limit is exceeded, the drive trips on fault 4310 Excess temperature."], "31.54": [540, "Selects the stop mode when a non-critical fault occurs. Drive coasts to a stop."], "32.01": [541, "Signal supervision status word. Indicates whether the values monitored by the signal supervision functions are within or outside their respective limits. This parameter is read-only. Note: This word is independent of the drive actions defined by parameters 32.06, 32.16, 32.26, 32.36, 32.46 and 32.56."], "32.05": [541, "Selects the mode of signal supervision function 1. Determines how the monitored signal (see parameter 32.07) is compared to its lower and upper limits (32.09 and 32.10 respectively). The action to be taken when the condition is fulfilled is selected by 32.06."], "32.06": [542, "Selects whether the drive generates a fault, warning or neither when the value monitored by signal supervision 1 exceeds its limits. Note: This parameter does not affect the status indicated by 32.01 Supervision status."], "32.07": [542, "Selects the signal to be monitored by signal supervision function 1."], "32.08": [543, "Defines a filter time constant for the signal monitored by signal supervision 1."], "32.09": [543, "Defines the lower limit for signal supervision 1."], "32.10": [543, ""], "32.11": [543, "Defines the hysteresis for the signal monitored by signal supervision 1. This parameter applies to all selections for parameter 32.05 Supervision 1 function, not just selection Hysteresis (7). Action is taken whenever the signal rises above the value defined by the upper limit + 0.5 · hysteresis."], "32.15": [543, "Selects the mode of signal supervision function 2. Determines how the monitored signal (see parameter 32.17) is compared to its lower and upper limits (32.19 and 32.20 respectively). The action to be taken when the condition is fulfilled is selected by 32.16."], "32.16": [544, "Selects whether the drive generates a fault, warning or neither when the value monitored by signal supervision 2 exceeds its limits. Note: This parameter does not affect the status indicated by 32.01 Supervision status."], "32.17": [544, "Selects the signal to be monitored by signal supervision function 2. For the available selections, see parameter 32.07 Supervision 1 signal."], "32.18": [545, "Defines a filter time constant for the signal monitored by signal supervision 2."], "32.19": [545, "Defines the lower limit for signal supervision 2."], "32.20": [545, "Defines the upper limit for signal supervision 2."], "32.21": [545, "Defines the hysteresis for the signal monitored by signal supervision 2. This parameter applies to all selections for parameter 32.15 Supervision 2 function, not just selection Hysteresis (7). Action is taken whenever the signal rises above the value defined by the upper limit + 0.5 · hysteresis."], "32.25": [545, "Selects the mode of signal supervision function 3. Determines how the monitored signal (see parameter 32.27) is compared to its lower and upper limits (32.29 and 32.30 respectively). The action to be taken when the condition is fulfilled is selected by 32.26."], "32.26": [546, "Selects whether the drive generates a fault, warning or neither when the value monitored by signal supervision 3 exceeds its limits. Note: This parameter does not affect the status indicated by 32.01 Supervision status. No warning or fault generated. Drive generates warning A8B2 ABB Signal supervision 3."], "32.27": [546, "Selects the signal to be monitored by signal supervision function 3."], "32.28": [546, "Defines a filter time constant for the signal monitored by signal supervision 3."], "32.29": [546, "Defines the lower limit for signal supervision 3."], "32.30": [546, "Defines the upper limit for signal supervision 3."], "32.31": [546, "Defines the hysteresis for the signal monitored by signal supervision 3. This parameter applies to all selections for parameter 32.25 Supervision 3 function, not just selection Hysteresis (7). Action is taken whenever the signal rises above the value defined by the upper limit + 0.5 · hysteresis."], "32.35": [547, "Selects the mode of signal supervision function 4. Determines how the monitored signal (see parameter 32.37) is compared to its lower and upper limits (32.39 and 32.30 respectively). The action to be taken when the condition is fulfilled is selected by 32.36."], "32.36": [548, "Selects whether the drive generates a fault, warning or neither when the value monitored by signal supervision 4 exceeds its limits. Note: This parameter does not affect the status indicated by 32.01 Supervision status."], "32.37": [548, "Selects the signal to be monitored by signal supervision function 4."], "32.38": [548, "Defines a filter time constant for the signal monitored by signal supervision 4."], "32.39": [548, "Defines the lower limit for signal supervision 4."], "32.40": [548, "Defines the upper limit for signal supervision 4."], "32.41": [548, "Defines the hysteresis for the signal monitored by signal supervision 4. This parameter applies to all selections for parameter 32.35 Supervision 4 function, not just selection Hysteresis (7). Action is taken whenever the signal rises above the value defined by the upper limit + 0.5 · hysteresis."], "32.45": [548, "Selects the mode of signal supervision function 5. Determines how the monitored signal (see parameter 32.47) is compared to its lower and upper limits (32.49 and 32.40 respectively). The action to be taken when the condition is fulfilled is selected by 32.46."], "32.46": [549, "Selects whether the drive generates a fault, warning or neither when the value monitored by signal supervision 5 exceeds its limits. Note: This parameter does not affect the status indicated by 32.01 Supervision status."], "32.47": [549, "Selects the signal to be monitored by signal supervision function 5."], "32.48": [549, "Defines a filter time constant for the signal monitored by signal supervision 5."], "32.49": [550, "Defines the lower limit for signal supervision 5."], "32.50": [550, "Defines the upper limit for signal supervision 5."], "32.51": [550, "Defines the hysteresis for the signal monitored by signal supervision 5. This parameter applies to all selections for parameter 32.45 Supervision 5 function, not just selection Hysteresis (7). Action is taken whenever the signal rises above the value defined by the upper limit + 0.5 · hysteresis."], "32.55": [550, "Selects the mode of signal supervision function 6. Determines how the monitored signal (see parameter 32.57) is compared to its lower and upper limits (32.59 and 32.50 respectively). The action to be taken when the condition is fulfilled is selected by 32.56."], "32.56": [551, "Selects whether the drive generates a fault, warning or neither when the value monitored by signal supervision 6 exceeds its limits. Note: This parameter does not affect the status indicated by 32.01 Supervision status."], "32.57": [551, "Selects the signal to be monitored by signal supervision function 6."], "32.58": [551, "Defines a filter time constant for the signal monitored by signal supervision 6."], "32.59": [551, "Defines the lower limit for signal supervision 6."], "32.60": [551, "Defines the upper limit for signal supervision 6."], "32.61": [551, "Defines the hysteresis for the signal monitored by signal supervision 6. This parameter applies to all selections for parameter 32.55 Supervision 6 function, not just selection Hysteresis (7). Action is taken whenever the signal rises above the value defined by the upper limit + 0.5 · hysteresis."], "34.01": [552, "Status of the combined timers. The status of a combined timer is the logical OR of all timers connected to it. This parameter is read-only. Description 1 = Active. 1 = Active."], "34.02": [552, "Status of timers 1…12. This parameter is read-only. Description 1 = Active. 1 = Active. 1 = Active. 1 = Active. 1 = Active. 1 = Active. 1 = Active. 1 = Active. 1 = Active. 1 = Active. 1 = Active."], "34.04": [553, "Status of seasons 1…4, exception weekday and exception holiday. Only one season can be active at a time. A day can be a workday and a holiday at the same time. This parameter is read-only. Description 1 = Active. 1 = Active. 1 = Active."], "34.10": [553, "Selects the source for the timed functions enable signal. 0 = Disabled. 1 = Enabled."], "34.11": [554, "Defines when timer 1 is active. Description 1 = Monday is an active start day. 1 = Tuesday is an active start day. 1 = Wednesday is an active start day. 1 = Thursday is an active start day. 1 = Friday is an active start day. 1 = Saturday is an active start day. 1 = Sunday is an active start day."], "34.12": [555, "Defines the daily start time of timer 1. The time can be changed in second steps. The timer can be started at an other time than the start time."], "34.13": [556, "Defines the duration of timer 1. The duration can be changed in minute steps. The duration can extend over the change of the day but if an exception day becomes active, the period is interrupted at midnight."], "34.14": [556, "See 34.11 Timer 1 configuration."], "34.15": [556, "See 34.12 Timer 1 start time."], "34.16": [556, "See 34.13 Timer 1 duration."], "34.17": [556, "See 34.11 Timer 1 configuration."], "34.18": [556, "See 34.12 Timer 1 start time."], "34.19": [556, "See 34.13 Timer 1 duration."], "34.20": [556, "See 34.11 Timer 1 configuration."], "34.21": [556, "See 34.12 Timer 1 start time."], "34.22": [556, "See 34.13 Timer 1 duration."], "34.23": [556, "See 34.11 Timer 1 configuration."], "34.24": [556, "See 34.12 Timer 1 start time."], "34.25": [556, "See 34.13 Timer 1 duration."], "34.26": [556, "See 34.11 Timer 1 configuration."], "34.27": [556, "See 34.12 Timer 1 start time."], "34.28": [556, "See 34.13 Timer 1 duration."], "34.29": [556, "See 34.11 Timer 1 configuration."], "34.30": [556, "See 34.12 Timer 1 start time. See 34.13 Timer 1 duration. See 34.11 Timer 1 configuration."], "34.33": [556, "See 34.12 Timer 1 start time."], "34.34": [556, "See 34.13 Timer 1 duration."], "34.35": [556, "See 34.11 Timer 1 configuration."], "34.36": [556, "See 34.12 Timer 1 start time."], "34.37": [556, "See 34.13 Timer 1 duration."], "34.38": [556, "See 34.11 Timer 1 configuration."], "34.39": [556, "See 34.12 Timer 1 start time."], "34.40": [556, "See 34.13 Timer 1 duration. Parameters 557 Description See 34.11 Timer 1 configuration."], "34.43": [557, "See 34.13 Timer 1 duration."], "34.44": [557, "See 34.11 Timer 1 configuration."], "34.45": [557, "See 34.12 Timer 1 start time."], "34.46": [557, "See 34.13 Timer 1 duration."], "34.60": [557, "is the number of the day and mm is the number of the month. The season changes at midnight. One season can be active at a time. Timers are started on exception days even if they are not inside the active season. The season start dates (1…4) must be given in increasing order to use all seasons."], "34.61": [557, "See 34.60 Season 1 start date."], "34.62": [557, "See 34.60 Season 1 start date."], "34.63": [557, "See 34.60 Season 1 start date."], "34.70": [557, "Defines how many of the exceptions are active by specifying the last active one. All preceding exceptions are active. Exceptions 1…3 are periods (duration can be defined) and exceptions 4…16 are days (duration is always 24 hours)."], "34.71": [558, "Defines the types of exceptions 1…16 as workday or holiday. 0000 0000 Exceptions 1…3 are periods (duration can be defined) and exceptions 4…16 are days (duration is always 24 hours). Description 0 = Workday. 1 = Holiday 0 = Workday. 1 = Holiday 0 = Workday. 1 = Holiday 0 = Workday. 1 = Holiday 0 = Workday."], "34.73": [558, "Defines the length of the exception period in days. Exception period is handled the same as a number of consecutive exception days."], "34.74": [558, "See 34.72 Exception 1 start."], "34.75": [558, "See 34.73 Exception 1 length."], "34.76": [558, "See 34.72 Exception 1 start."], "34.77": [558, "See 34.73 Exception 1 length."], "34.78": [558, "Defines the date of exception day 4."], "34.79": [558, "See 34.79 Exception day 4."], "34.80": [558, "See 34.79 Exception day 4."], "34.81": [558, "See 34.79 Exception day 4"], "34.82": [558, "See 34.79 Exception day 4. Description"], "34.83": [559, "See 34.79 Exception day 4."], "34.84": [559, "See 34.79 Exception day 4."], "34.85": [559, "See 34.79 Exception day 4."], "34.86": [559, "See 34.79 Exception day 4."], "34.87": [559, "See 34.79 Exception day 4."], "34.88": [559, "See 34.79 Exception day 4."], "34.89": [559, "See 34.79 Exception day 4."], "34.90": [559, "See 34.79 Exception day 4. Defines which timers are connected to combined timer 1. 0 = Not connected. 1 = Connected. See 34.01 Timed functions status. Description 0 = Inactive. 1 = Active. 0 = Inactive. 1 = Active. 0 = Inactive. 1 = Active. 0 = Inactive. 1 = Active. 0 = Inactive. 1 = Active. 0 = Inactive. 1 = Active."], "35.01": [560, "Displays the motor temperature as estimated by the internal motor thermal protection model (see parameters 35.50…35.55). The unit is selected by parameter 96.16 Unit selection."], "35.02": [561, "Displays the temperature received through the source defined by parameter 35.11 Temperature 1 source. The unit is selected by parameter 96.16 Unit selection. Notes: • With a PTC sensor, the value shown is not a valid measurement."], "35.03": [561, "Displays the temperature received through the source defined by parameter 35.21 Temperature 2 source. The unit is selected by parameter 96.16 Unit selection. Notes: • With a PTC sensor, the value shown is not a valid measurement."], "35.05": [561, "Motor overload level as a percent of the motor overload fault limit. See section Motor overload protection (page 207)."], "35.11": [562, "Selects the source from which measured temperature 1 is read. Usually this source is from a sensor connected to the motor controlled by the drive, but it could be used to measure and monitor a temperature from other parts of the process as long as a suitable sensor is used as per the selection list. None."], "35.12": [564, "Defines the fault limit for temperature supervision function 1. When measured temperature 1 exceeds the limit, the drive trips on fault 4981 External temperature 1. The unit is selected by parameter 96.16 Unit selection. Notes: • With a PTC sensor, the unit is ohms."], "35.13": [564, "Defines the warning limit for temperature supervision function 1. When measured temperature 1 exceeds the limit, warning A491 External temperature 1 is generated. The unit is selected by parameter 96.16 Unit selection. Notes: • With a PTC sensor, the unit is ohms."], "35.14": [565, "Specifies the analog input when the setting of 35.11 Temperature 1 source requires measurement through an analog input. Note: If parameter 35.11 Temperature 1 source is set to Direct temperature, use selection Other here, and point to 12.12 AI1 scaled value."], "35.21": [565, "Selects the source from which measured temperature 2 is read. Usually this source is from a sensor connected to the motor controlled by the drive, but it could be used to measure and monitor a temperature from other parts of the process as long as a suitable sensor is used as per the selection list. None."], "35.22": [568, "Defines the fault limit for temperature supervision function 2. When measured temperature 1 exceeds the limit, the drive trips on fault 4982 External temperature 2. The unit is selected by parameter 96.16 Unit selection. Notes: • With a PTC sensor, the unit is ohms."], "35.23": [568, "Defines the warning limit for temperature supervision function 2. When measured temperature 1 exceeds the limit, warning A492 External temperature 2 is ge
