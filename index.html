nerated. The unit is selected by parameter 96.16 Unit selection. Notes: • With a PTC sensor, the unit is ohms."], "35.24": [568, "Specifies the analog input when the setting of 35.11 Temperature 1 source requires measurement through an analog input."], "35.31": [568, "Activates or deactivates the Safe motor temperature (SMT) Automatically activated when the CPTC-02 ATEX-certified thermistor protection module is connected to the drive."], "35.50": [569, "Defines the ambient temperature of the motor for the motor thermal protection model. The unit is selected by parameter 96.16 Unit selection. The motor thermal protection model estimates the motor temperature on the basis of parameters 35.50…35.55."], "35.51": [569, "Defines the maximum thermal load of the motor. If the load is above the curve, the motor can be overheated. The load curve is used by the motor thermal protection model to estimate the motor temperature."], "35.52": [569, "Defines the motor load curve together with parameters 35.51 Motor load curve and 35.53 Break point. Defines the maximum motor load at zero speed of the load curve. A higher value can be used if the motor has an external motor fan to boost the cooling. See the motor manufacturer's recommendations."], "35.53": [570, "Defines the motor load curve together with parameters 35.51 Motor load curve and 35.52 Zero speed load."], "35.54": [570, "Defines the temperature rise of the motor above ambient when the motor is loaded with nominal current. See the motor manufacturer's recommendations. The unit is selected by parameter 96.16 Unit selection."], "35.57": [571, "Defines the motor overload class to be used. The class of protection is specified by the user as the time for tripping at 7.2 times (IEC 60947-4-1) or 6 times (NEMA ICS) the tripping level current. See section Motor overload protection (page 207)."], "36.01": [572, "Selects the signal to be monitored by the peak value logger. The signal is filtered using the filtering time specified by parameter 36.02 PVL filter time. The peak value is stored, along with other pre-selected signals at the time, into parameters 36.10…36.15."], "36.06": [573, "Selects the signal to be monitored by amplitude logger 2. The signal is sampled at 200 ms intervals. The results are displayed by parameters 36.40…36.49. Each parameter represents an amplitude range, and shows what portion of the samples fall within that range."], "36.07": [573, "Defines the signal value that corresponds to 100% amplitude. 50.00 or"], "36.09": [573, "Resets the peak value logger and/or amplitude logger 2. (Amplitude logger 1 cannot be reset.) Reset completed or not requested (normal operation)."], "36.10": [573, "Peak value recorded by the peak value logger."], "36.11": [573, "The date on which the peak value was recorded. Peak occurrence date."], "36.12": [573, "The time at which the peak value was recorded. Peak occurrence time."], "36.13": [573, "Motor current at the moment the peak value was recorded."], "36.14": [573, "Voltage in the intermediate DC circuit of the drive at the moment the peak value was recorded."], "36.15": [573, "Motor speed at the moment the peak value was recorded."], "36.16": [573, "The date on which the peak value logger was last reset. Last reset date of the peak value logger."], "36.17": [573, "The time at which the peak value logger was last reset. Last reset time of the peak value logger."], "36.20": [574, "Percentage of samples recorded by amplitude logger 1 that fall between 0 and 10%."], "36.21": [574, "Percentage of samples recorded by amplitude logger 1 that fall between 10 and 20%."], "36.22": [574, "Percentage of samples recorded by amplitude logger 1 that fall between 20 and 30%."], "36.23": [574, "Percentage of samples recorded by amplitude logger 1 that fall between 30 and 40%."], "36.24": [574, "Percentage of samples recorded by amplitude logger 1 that fall between 40 and 50%."], "36.25": [574, "Percentage of samples recorded by amplitude logger 1 that"], "36.26": [574, "Percentage of samples recorded by amplitude logger 1 that fall between 60 and 70%."], "36.27": [574, "Percentage of samples recorded by amplitude logger 1 that fall between 70 and 80%."], "36.28": [574, "Percentage of samples recorded by amplitude logger 1 that fall between 80 and 90%."], "36.29": [574, "Percentage of samples recorded by amplitude logger 1 that exceed 90%."], "36.40": [574, "Percentage of samples recorded by amplitude logger 2 that fall between 0 and 10%."], "36.41": [574, "Percentage of samples recorded by amplitude logger 2 that fall between 10 and 20%."], "36.42": [574, "Percentage of samples recorded by amplitude logger 2 that fall between 20 and 30%."], "36.43": [574, "Percentage of samples recorded by amplitude logger 2 that fall between 30 and 40%."], "36.44": [574, "Percentage of samples recorded by amplitude logger 2 that fall between 40 and 50%."], "36.45": [575, "Percentage of samples recorded by amplitude logger 2 that fall between 50 and 60%."], "36.46": [575, "Percentage of samples recorded by amplitude logger 2 that fall between 60 and 70%."], "36.47": [575, "Percentage of samples recorded by amplitude logger 2 that fall between 70 and 80%."], "36.48": [575, "Percentage of samples recorded by amplitude logger 2 that fall between 80 and 90%."], "36.49": [575, "Percentage of samples recorded by amplitude logger 2 that exceed 90%."], "36.50": [575, "The date on which amplitude logger 2 was last reset. Last reset date of amplitude logger 2."], "36.51": [575, "The time at which amplitude logger 2 was last reset. Last reset time of amplitude logger 2. Settings for user load curve."], "37.01": [575, "Displays the status of the monitored signal. The status is shown only while the drive is running. (The status word is independent of the actions and delays selected by parameters 37.03, 37.04, 37.41 and 37.42.) This parameter is read-only. Description 1 = Signal lower than the underload curve."], "37.02": [575, "Selects the signal to be monitored. The function compares the absolute value of the signal against the load curve."], "37.03": [576, "Selects how the drive reacts if the absolute value of the monitored signal stays continuously above the overload curve for longer than the value of 37.41 ULC overload timer."], "37.04": [576, "parameter 37.41 ULC overload timer. Selects how the drive reacts if the absolute value of the monitored signal stays continuously above the overload curve for longer than the value of 37.42 ULC underload timer."], "37.11": [576, "Defines the first of the five speed points on the X-axis of the user load curve. Speed points are used if parameter 99.04 Motor control mode is set to Vector or if 99.04 Motor control mode is set to Scalar and the reference unit is rpm. The five points must be in order from lowest to highest."], "37.12": [576, "Defines the second speed point. See parameter 37.11 ULC speed table point 1."], "37.13": [576, "Defines the third speed point. See parameter 37.11 ULC speed table point 1."], "37.14": [576, "Defines the fourth speed point. See parameter 37.11 ULC speed table point 1."], "37.15": [576, "Defines the fifth speed point. See parameter 37.11 ULC speed table point 1."], "37.16": [577, "Defines the first of the five frequency points on the X-axis of the user load curve. Frequency points are used if parameter 99.04 Motor control mode is set to Scalar and the reference unit is Hz. The five points must be in order from lowest to highest."], "37.17": [577, "Defines the second frequency point. See parameter 37.16 ULC frequency table point 1."], "37.18": [577, "Defines the third frequency point. See parameter 37.16 ULC frequency table point 1."], "37.19": [577, "Defines the fourth frequency point. See parameter 37.16 ULC frequency table point 1."], "37.20": [577, "Defines the fifth frequency point. See parameter 37.16 ULC frequency table point 1."], "37.21": [577, "Defines the first of the five points on the Y-axis that together with the corresponding point on the X-axis (37.11 ULC speed table point 1…37.15 ULC speed table point 5 or 37.15 ULC speed table point 5…37.20 ULC frequency table point 5) define the underload (lower) curve."], "37.22": [577, "Defines the second underload point. See parameter 37.21 ULC underload point 1."], "37.23": [577, "Defines the third underload point. See parameter 37.21 ULC underload point 1."], "37.24": [577, "Defines the fourth underload point. See parameter 37.21 ULC underload point 1."], "37.25": [577, "Defines the fifth underload point. See parameter 37.21 ULC underload point 1"], "37.31": [577, "Defines the first of the five points on the Y-axis that together with the corresponding point on the X-axis (37.11 ULC speed table point 1…37.15 ULC speed table point 5 or 37.15 ULC speed table point 5…37.20 ULC frequency table point 5) define the overload (higher) curve."], "37.32": [578, "Defines the second overload point. See parameter 37.31 ULC overload point 1."], "37.33": [578, "Defines the third overload point. See parameter 37.31 ULC overload point 1."], "37.34": [578, "Defines the fourth overload point. See parameter 37.31 ULC overload point 1."], "37.35": [578, "Defines the fifth overload point. See parameter 37.31 ULC overload point 1."], "37.41": [578, "continuously stay above the overload curve before the drive takes the action selected by 37.03 ULC overload actions."], "37.42": [578, "Defines the time for which the monitored signal must continuously stay below the underload curve before the drive takes the action selected by 37.04 ULC underload actions."], "40.01": [578, "Displays the output of the process PID controller. See control chain diagram Process PID controller on page 376. This parameter is read-only."], "40.02": [578, "Displays the value of process feedback after source selection, mathematical function (parameter 40.10 Set 1 feedback function), and filtering. See control chain diagram PID setpoint compensation on page 374. This parameter is read-only."], "40.03": [579, "Displays the value of process PID setpoint after source selection, mathematical function (40.18 Set 1 setpoint function), limitation and ramping. See control chain diagram PID setpoint compensation on page 374. This parameter is read-only."], "40.04": [579, "Displays the process PID deviation. By default, this value equals setpoint - feedback, but deviation can be inverted by parameter 40.31 Set 1 deviation inversion. See control chain diagram Process PID controller on page 376. This parameter is read-only."], "40.06": [579, "Displays status information on process PID control. This parameter is read-only. Value 1 = Process PID control active. 1 = Process PID setpoint frozen. 1 = Process PID controller output frozen. 1 = Sleep mode active. 1 = Sleep boost active. 1 = Tracking function active. 1 = PID output is being limited by par. 40.37."], "40.07": [579, "Activates/deactivates process PID control. Note: Process PID control is only available in external control; see section Local control vs. external control (page 107)."], "40.08": [580, "Selects the primary source of process feedback. See control chain diagram PID setpoint compensation on page 374."], "40.09": [580, "Selects the second source of process feedback. The second source is used only if the setpoint function requires two inputs."], "40.10": [580, "Defines how process feedback is calculated from the two feedback sources selected by parameters 40.08 Set 1 feedback 1 source and 40.09 Set 1 feedback 2 source. The result of the function (for any selection) is multiplied by parameter 40.90 Set 1 feedback multiplier."], "40.11": [581, "Defines the filter time constant for process feedback."], "40.14": [581, "Defines, together with parameter 40.15 Set 1 output scaling, a general scaling factor for the process PID control chain. If the parameter is set to zero, automatic setpoint scaling is activated, where suitable setpoint scale is calculated according to selected setpoint source."], "40.15": [581, "See parameter 40.14 Set 1 setpoint scaling. If the parameter is set to zero, scaling is automatic: Operation mode Scaling (see par."], "40.16": [581, "Selects the primary source of process PID setpoint. See the control chain diagram on page 374."], "40.17": [582, "Selects the second source of process setpoint. The second source is used only if the setpoint function requires two inputs. For the available selections, see parameter 40.16 Set 1 setpoint 1 source."], "40.18": [583, "Selects a function between the setpoint sources selected by parameters 40.16 Set 1 setpoint 1 source and 40.17 Set 1 setpoint 2 source. The result of the function (for any selection) is multiplied by parameter 40.89 Set 1 setpoint multiplier."], "40.19": [583, "Selects together with 40.20 Set 1 internal setpoint sel2 the internal setpoint out of the presets defined by parameters 40.21…40.24. Note: Parameters 40.16 Set 1 setpoint 1 source and 40.17 Set 1 setpoint 2 source must be set to Internal setpoint. Source defined Source defined Setpoint preset active by par."], "40.20": [584, "Selects together with 40.19 Set 1 internal setpoint sel1 the internal setpoint used out of the three internal setpoints defined by parameters 40.21…40.23. See table at 40.19 Set 1 internal setpoint sel1."], "40.21": [584, "Internal process setpoint 1. See parameter 40.19 Set 1 internal setpoint sel1."], "40.22": [584, "Internal process setpoint 2. See parameter 40.19 Set 1 internal setpoint sel1."], "40.23": [584, "Internal process setpoint 3. See parameter 40.19 Set 1 internal setpoint sel1."], "40.24": [584, "Internal process setpoint 0. See parameter 40.19 Set 1 internal setpoint sel1."], "40.26": [584, "Defines a minimum limit for the process PID controller setpoint."], "40.27": [585, "Defines a maximum limit for the process PID controller setpoint."], "40.28": [585, "Defines the minimum time it takes for the setpoint to increase from 0% to 100%."], "40.29": [585, "Defines the minimum time it takes for the setpoint to decrease from 100% to 0%."], "40.30": [585, "Freezes, or defines a source that can be used to freeze, the setpoint of the process PID controller. This feature is useful when the reference is based on a process feedback connected to an analog input, and the sensor must be serviced without stopping the process."], "40.31": [585, "Inverts the input of the process PID controller. 0 = Deviation not inverted (Deviation = Setpoint - Feedback) 1 = Deviation inverted (Deviation = Feedback - Setpoint) See also section Sleep and boost functions for process PID control (page 167)."], "40.32": [586, "Defines the gain for the process PID controller. See parameter 40.33 Set 1 integration time."], "40.33": [586, "Defines the integration time for the process PID controller. This time needs to be set to the same order of magnitude as the reaction time of the process being controlled, otherwise instability will result."], "40.34": [586, "Defines the derivation time of the process PID controller. The derivative component at the controller output is calculated on basis of two consecutive error values (EK-1 and EK) according to the following formula: PID DERIV TIME × (EK - EK-1)/TS, in which TS = 2 ms sample time E = Error = Process reference - process fe"], "40.35": [587, "Defines the time constant of the 1-pole filter used to smooth the derivative component of the process PID controller."], "40.36": [587, "Defines the minimum limit for the process PID controller output."], "40.37": [587, "Defines the maximum limit for the process PID controller output."], "40.38": [587, "Freezes (or defines a source that can be used to freeze) the output of the process PID controller, keeping the output at the value it was before freeze was enabled. This feature can be used when, for example, a sensor providing process feedback must to be serviced without stopping the process."], "40.39": [588, "Defines a deadband around the setpoint. Whenever process feedback enters the deadband, a delay timer starts. If the feedback remains within the deadband longer than the delay (40.40 Set 1 deadband delay), the PID controller output is frozen. Normal operation resumes after the feedback value leaves the deadband."], "40.40": [588, "Delay for the deadband. See parameter 40.39 Set 1 deadband range."], "40.43": [588, "Defines the start limit for the sleep function. If the value is 0.0, set 1 sleep mode is disabled. The sleep function compares PID output (parameter 40.01 Process PID output actual) to the value of this parameter."], "40.44": [588, "Defines a delay before the sleep function actually becomes enabled, to prevent nuisance sleeping."], "40.45": [588, "Defines a boost time for the sleep boost step. See parameter 40.46 Set 1 sleep boost step."], "40.46": [589, "When the drive is entering sleep mode, the process setpoint is increased by this value for the time defined by parameter 40.45 Set 1 sleep boost time."], "40.47": [589, "Defines the wake-up level as deviation between process setpoint and feedback. When the deviation exceeds the value of this parameter, and remains there for the duration of the wake-up delay (40.48 Set 1 wake-up delay), the drive wakes up."], "40.48": [589, "Defines a wake-up delay for the sleep function to prevent nuisance wake-ups. See parameter 40.47 Set 1 wake-up deviation."], "40.49": [589, "Activates (or selects a source that activates) tracking mode. In tracking mode, the value selected by parameter 40.50 Set 1 tracking ref selection is substituted for the PID controller output. See also section Tracking (page 169)."], "40.50": [589, "Selects the value source for tracking mode. See parameter 40.49 Set 1 tracking mode."], "40.57": [590, "Selects the source that determines whether process PID parameter set 1 (parameters 40.07…40.50) or set 2 (group 41 Process PID set 2) is used. 0."], "40.58": [590, "Activates increase prevention of PID integration term for PID set 1 Increase prevention not in use."], "40.59": [590, "Activates decrease prevention of PID integration term for PID set 1."], "40.60": [590, "Selects a source that enables/disables process PID control. See also parameter 40.07 Process PID operation mode. 0 = Process PID control disabled. 1 = Process PID control enabled."], "40.61": [591, "Actual setpoint scaling. See parameter 40.14 Set 1 setpoint scaling."], "40.62": [591, "Displays the value of the internal setpoint. See control chain diagram PID setpoint compensation on page 374."], "40.70": [591, "Compensated setpoint determined for the input specified by parameter 40.71 Set 1 compensation input source. This parameter is read-only. The determination of the compensated setpoint is based on the curve specified by points (x1, y1), (x2, y2) and the non- linearity of the curve specified with parameters 40.71…40.76."], "40.71": [592, "Selects the source for set 1 compensation input. None."], "40.72": [592, "Point x1 on the setpoint compensation curve, see parameter"], "40.73": [592, "Point y1 (= the compensated output of parameter 40.72 Set 1 compensation input 1) on the setpoint compensation curve, see parameter 40.70 Compensated setpoint."], "40.74": [592, "Point x2 on the setpoint compensation curve, see parameter"], "40.75": [592, "Point y2 (= the compensated output of parameter 40.74 Set 1 compensation input 2) on the setpoint compensation curve, see parameter 40.70 Compensated setpoint."], "40.76": [593, "Describes the non-linearity of the setpoint compensation curve, see parameter 40.70 Compensated setpoint."], "40.79": [593, "Unit used for PID set 1. User text User editable text. User text default is “PID unit 1”."], "40.80": [593, "Selects the source for set 1 PID output minimum. Not selected."], "40.81": [594, "Selects the source for set 1 PID output maximum. Not selected."], "40.89": [594, "Defines the multiplier with which the result of the function specified by parameter 40.18 Set 1 setpoint function is multiplied."], "40.90": [594, "Defines the multiplier with which the result of the function specified by parameter 40.10 Set 1 feedback function is"], "40.91": [594, "Storage parameter for receiving a process feedback value, for example, through the embedded fieldbus interface. The value can be sent to the drive as Modbus I/O data. Set the target selection parameter of that particular data (58.101…58.114) to Feedback data storage."], "40.92": [594, "Storage parameter for receiving a process setpoint value, for example, through the embedded fieldbus interface. The value can be sent to the drive as Modbus I/O data. Set the target selection parameter of that particular data (58.101…58.114) to Setpoint data storage."], "40.96": [594, "Percentage scaled signal of parameter 40.01 Process PID feedback actual."], "40.97": [594, "Percentage scaled signal of parameter 40.02 Process PID feedback actual."], "40.98": [594, "Percentage scaled signal of parameter 40.03 Process PID setpoint actual."], "40.99": [594, "Percentage scaled signal of parameter 40.04 Process PID deviation actual."], "41.08": [595, "See parameter 40.08 Set 1 feedback 1 source."], "41.09": [595, "See parameter 40.09 Set 1 feedback 2 source."], "41.10": [595, "See parameter 40.10 Set 1 feedback function. Description"], "41.11": [596, "See parameter 40.11 Set 1 feedback filter time. 0.000 s"], "41.14": [596, "See parameter 40.14 Set 1 setpoint scaling. 0.00"], "41.15": [596, "See parameter 40.15 Set 1 output scaling. 0.00"], "41.16": [596, "See parameter 40.16 Set 1 setpoint 1 source. Internal"], "41.17": [596, "See parameter 40.17 Set 1 setpoint 2 source. Not selected"], "41.18": [596, "See parameter 40.18 Set 1 setpoint function. In1"], "41.19": [596, "See parameter 40.19 Set 1 internal setpoint sel1. Not selected"], "41.20": [596, "See parameter 40.20 Set 1 internal setpoint sel2. Not selected"], "41.21": [596, "See parameter 40.21 Set 1 internal setpoint 1. 0.00"], "41.22": [596, "See parameter 40.22 Set 1 internal setpoint 2. 0.00"], "41.23": [596, "See parameter 40.23 Set 1 internal setpoint 3. 0.00"], "41.24": [596, "See parameter 40.24 Set 1 internal setpoint 0. 0.00"], "41.26": [596, "See parameter 40.26 Set 1 setpoint min. 0.00"], "41.27": [596, "See parameter 40.27 Set 1 setpoint max. 200000.00"], "41.28": [596, "See parameter 40.28 Set 1 setpoint increase time. 0.0 s"], "41.29": [596, "See parameter 40.29 Set 1 setpoint decrease time. 0.0 s"], "41.30": [596, "See parameter 40.30 Set 1 setpoint freeze enable. Not selected"], "41.31": [596, "See parameter 40.31 Set 1 deviation inversion. Not inverted"], "41.32": [596, "See parameter 40.32 Set 1 gain. 1.00"], "41.33": [596, "See parameter 40.33 Set 1 integration time. 60.0 s"], "41.34": [596, "See parameter 40.34 Set 1 derivation time. 0.000 s"], "41.35": [596, "See parameter 40.35 Set 1 derivation filter time. 0.0 s"], "41.36": [596, "See parameter 40.36 Set 1 output min. 0.00"], "41.37": [596, "See parameter 40.37 Set 1 output max. 100.00"], "41.38": [596, "See parameter 40.38 Set 1 output freeze enable. Not selected Parameters 597 Description See parameter 40.39 Set 1 deadband range."], "41.40": [597, "See parameter 40.40 Set 1 deadband delay. 0.0 s"], "41.43": [597, "See parameter 40.43 Set 1 sleep level. 0.0"], "41.44": [597, "See parameter 40.44 Set 1 sleep delay. 60.0 s"], "41.45": [597, "See parameter 40.45 Set 1 sleep boost time. 0.0 s"], "41.46": [597, "See parameter 40.46 Set 1 sleep boost step. 0.00"], "41.47": [597, "See parameter 40.47 Set 1 wake-up deviation. 0.00"], "41.48": [597, "See parameter 40.48 Set 1 wake-up delay. 0.50 s"], "41.49": [597, "See parameter 40.49 Set 1 tracking mode."], "41.50": [597, "See parameter 40.50 Set 1 tracking ref selection. Not selected"], "41.58": [597, "See parameter 40.58 Set 1 increase prevention."], "41.59": [597, "See parameter 40.59 Set 1 decrease prevention. No"], "41.60": [597, "See parameter 40.60 Set 1 PID activation source."], "41.71": [597, "See parameter 40.71 Set 1 compensation input source. Not selected"], "41.72": [597, "See parameter 40.72 Set 1 compensation input 1. 0.00"], "41.73": [597, "See parameter 40.73 Set 1 compensated output 1. 0.00"], "41.74": [597, "See parameter 40.74 Set 1 compensation input 2. 0.00"], "41.75": [597, "See parameter 40.75 Set 1 compensated output 2. 0.00"], "41.76": [597, "See parameter 40.76 Set 1 compensation non-linearity. 0%"], "41.79": [597, "See parameter 40.79 Set 1 units. bar"], "41.80": [597, "Selects the source for set 2 PID output minimum. Set2 output None."], "41.81": [597, "Selects the source for set 2 PID output maximum. None."], "41.89": [598, "See parameter 40.89 Set 1 setpoint multiplier."], "41.90": [598, "Defines the multiplier k used in formulas of parameter 41.10 Set 2 feedback function. See parameter 40.90 Set 1 feedback multiplier. Settings for the internal brake chopper. Note: These parameters apply to internal brake chopper only."], "43.01": [598, "Displays the estimated temperature of the brake resistor, or how close the brake resistor is to being too hot. The value is given in percent where 100% is the eventual temperature the resistor would reach when loaded long enough with its rated maximum load capacity (43.09 Brake resistor Pmax cont)."], "43.06": [598, "Enables brake chopper control and selects the brake resistor overload protection method (calculation or measurement)."], "43.07": [599, "Selects the source for quick brake chopper on/off control. 0 = Brake chopper IGBT pulses are cut off 1 = Normal brake chopper IGBT modulation allowed."], "43.08": [599, "Defines the thermal time constant for the brake resistor thermal model."], "43.09": [599, "Defines the maximum continuous load of the brake resistor that will eventually raise the resistor temperature to the maximum allowed value (= continuous heat dissipation capacity of the resistor in kW) but not above it. The value is used in the resistor overload protection based on the thermal model."], "43.10": [599, "Defines the resistance value of the brake resistor. The value is used for the brake resistor protection based on the thermal model."], "43.11": [599, "Defines the fault limit for the brake resistor protection based on the thermal model. See parameter 43.06 Brake chopper function. When the limit is exceeded, the drive trips on fault 7183 BR excess temperature."], "43.12": [600, "Defines the warning limit for the brake resistor protection based on the thermal model. See parameter 43.06 Brake chopper function. When the limit is exceeded, the drive generates warning A793 BR excess temperature."], "45.01": [600, "Energy saved in GWh compared to direct-on-line motor connection. This parameter is incremented when 45.02 Saved MW hours rolls over."], "45.02": [600, "Energy saved in MWh compared to direct-on-line motor connection. This parameter is incremented when 45.03 Saved kW hours rolls over. When this parameter rolls over, parameter 45.01 Saved GW hours is incremented."], "45.03": [600, "Energy saved in kWh compared to direct-on-line motor connection. If the internal brake chopper of the drive is enabled, all energy fed by the motor to the drive is assumed to be converted into heat, but the calculation still records savings made by controlling the speed."], "45.04": [600, "Energy saved in kWh compared to direct-on-line motor connection. If the internal brake chopper of the drive is enabled, all energy fed by the motor to the drive is assumed to be converted into heat."], "45.05": [601, "Monetary savings in thousands compared to direct-on-line motor connection. This parameter is incremented when 45.06 Saved money rolls over. If you have not set the currency during the first start-up, you can specify it in Main menu > Primary settings > Clock, region display > Units > Currency."], "45.06": [601, "Monetary savings compared to direct-on-line motor connection. This value is a calculated by multiplying the saved energy in kWh by the currently active energy tariff (45.14 Tariff selection). When this parameter rolls over, parameter 45.05 Saved money x1000 is incremented."], "45.07": [601, "Monetary savings compared to direct-on-line motor connection. This value is a calculated by multiplying the saved energy in kWh by the currently active energy tariff (45.14 Tariff selection)."], "45.08": [601, "Reduction in CO2 emissions in metric kilotons compared to direct-on-line motor connection. This value is incremented when parameter 45.09 CO2 reduction in tons rolls over."], "45.09": [601, "Reduction in CO2 emissions in metric tons compared to direct-on-line motor connection. This value is calculated by multiplying the saved energy in MWh by the value of parameter 45.18 CO2 conversion factor (by default, 0.5 metric tons/MWh)."], "45.10": [602, "Reduction in CO2 emissions in metric tons compared to direct-on-line motor connection. This value is calculated by multiplying the saved energy in MWh by the value of parameter 45.18 CO2 conversion factor (by default, 0.5 metric tons/MWh)."], "45.11": [602, "Enables/disables the energy optimization function. The function optimizes the motor flux so that total energy consumption and motor noise level are reduced when the drive operates below the nominal load. The total efficiency (motor and drive) can be improved by 1…20% depending on load torque and speed."], "45.12": [602, "Defines energy tariff 1 (price of energy per kWh). Depending on the setting of parameter 45.14 Tariff selection, either this value or 45.13 Energy tariff 2 is used for reference when monetary savings are calculated."], "45.13": [602, "Defines energy tariff 2 (price of energy per kWh). See parameter 45.12 Energy tariff 1."], "45.14": [602, "Selects (or defines a source that selects) which pre-defined energy tariff is used. 0 = 45.12 Energy tariff 1. 1 = 45.13 Energy tariff 2."], "45.18": [603, "Defines a factor for conversion of saved energy into CO2 emissions (kg/kWh or tn/MWh)."], "45.19": [603, "Actual power that the motor absorbs when connected direct- on-line and operating the application. The value is used for reference when energy savings are calculated. Note: The accuracy of the energy savings calculation is directly dependent on the accuracy of this value."], "45.21": [603, "Reset not requested (normal operation), or reset complete."], "45.24": [603, "Value of the peak power during the last hour, that is, the most recent 60 minutes after the drive has been powered up. The parameter is updated once every 10 minutes unless the hourly peak is found in the most recent 10 minutes. In that case, the values is shown immediately."], "45.25": [603, "Time of the peak power value during the last hour. Note: This parameter is read-only."], "45.26": [603, "Total energy consumption during the last hour, that is, the most recent 60 minutes."], "45.27": [603, "Value of the peak power since midnight of the present day. You can reset the value by setting it to zero."], "45.28": [603, "Time of the peak power since midnight of the present day. Note: This parameter is read-only."], "45.29": [603, "Total energy consumption since midnight of the present day. You can reset the value by setting it to zero."], "45.30": [604, "Total energy consumption during the previous day, that is, between midnight of the previous day and midnight of the present day"], "45.31": [604, "Value of the peak power during the present month, that is, since midnight of the first day of the present month."], "45.32": [604, "Date of the peak power during the present month. Note: This parameter is read-only."], "45.33": [604, "Time of the peak power during the present month. Note: This parameter is read-only. Time. Total energy consumption from the beginning of the present month."], "45.35": [604, "Total energy consumption during the previous month, that is, between midnight of the first day or the previous month and midnight of the first day of the present month."], "45.36": [604, "Value of the peak power over the drive lifetime. Note: This parameter is read-only."], "45.37": [604, "Date of the peak power over the drive lifetime. Note: This parameter is read-only."], "45.38": [604, "Time of the peak power over the drive lifetime. Note: This parameter is read-only. Time."], "46.01": [605, "Defines the maximum speed value used to define the acceleration ramp rate and the initial speed value used to define the deceleration ramp rate (see parameter group 23 Speed reference ramp). The speed acceleration and deceleration ramp times are therefore related to this value (not to parameter 30.12 Maximum speed)."], "46.02": [605, "Defines the maximum frequency value used to define the acceleration ramp rate and the initial frequency value used to define deceleration ramp rate (see parameter group 28 Frequency reference chain)."], "46.03": [605, "Defines the 16-bit scaling of torque parameters. The value of this parameter (in percent of nominal motor torque) corresponds to 10000, for example, in fieldbus communication."], "46.04": [605, "Defines the 16-bit scaling of power parameters. The value of this parameter corresponds to 10000, for example, in fieldbus communication. The unit is selected by parameter 96.16 Unit selection."], "46.05": [605, "Defines the 16-bit scaling of current parameters. The value of this parameter corresponds to 10000, for example, in fieldbus communication."], "46.06": [605, "Defines a speed corresponding to a zero reference received from fieldbus (either the embedded fieldbus interface, or interface FBA A). For example, with a setting of 500, the fieldbus reference range of 0…20000 would correspond to a speed of 500…[46.01] rpm."], "46.07": [606, "Defines a frequency corresponding to a zero reference received from fieldbus (either the embedded fieldbus interface, or interface FBA). For example, with a setting of 30, the fieldbus reference range of 0…20000 would correspond to a speed of 30…[46.02] Hz."], "46.11": [606, "Defines a filter time for signals 01.01 Motor speed used and 01.02 Motor speed estimated."], "46.12": [606, "Defines a filter time for signal 01.06 Output frequency."], "46.13": [606, "Defines a filter time for signal 01.10 Motor torque."], "46.14": [606, "Defines a filter time for signal 01.14 Output power."], "46.21": [606, "Defines the “at setpoint” limits for speed control of the drive. When the difference between reference (22.87 Speed reference act 7) and the speed (24.02 Used speed feedback) is smaller than 46.21 At speed hysteresis, the drive is considered to be “at setpoint”. This is indicated by bit 8 of 06.11 Main status word."], "46.22": [607, "Defines the “at setpoint” limits for frequency control of the drive. When the absolute difference between reference (28.96 Frequency ref ramp input) and actual frequency (01.06 Output frequency) is smaller than 46.22 At frequency hysteresis, the drive is considered to be “at setpoint”."], "46.31": [607, "Defines the trigger level for “above limit” indication in speed control. When actual speed exceeds the limit, bit 10 of 06.17 1800.00 rpm Drive status word 2 is set."], "46.32": [607, "Defines the trigger level for “above limit” indication in frequency control. When actual frequency exceeds the limit, bit 10 of 06.17 Drive status word 2 is set."], "46.41": [607, "Defines the trigger level for the “kWh pulse” on for 50 ms. The output of the pulse is bit 9 of 05.22 Diagnostic word 3."], "46.43": [607, "Defines the number of decimals shown for parameter 99.10 Motor nominal power on the control panel and Drive composer PC tool. It also defines 32-bit scaling of power parameters. The value of this parameter corresponds to the number of decimals assumed in the 32-bit integer fieldbus communication."], "46.44": [607, "Defines the number of decimals shown for parameter 99.06 Motor nominal current on the control panel and Drive composer PC tool. It also defines 32-bit scaling of current parameters. The value of this parameter corresponds to the number of decimals assumed in the 32-bit integer fieldbus communication."], "47.01": [608, "Data storage parameter 1."], "47.02": [608, "Data storage parameter 2."], "47.03": [608, "Data storage parameter 3."], "47.04": [608, "Data storage parameter 4."], "47.11": [608, "Data storage parameter 9."], "47.12": [608, "Data storage parameter 10."], "47.13": [608, "Data storage parameter 11."], "47.14": [609, "Data storage parameter 12."], "47.21": [609, "Data storage parameter 17."], "47.22": [609, "Data storage parameter 18."], "49.01": [609, "Defines the node ID of the drive. All devices connected to the network must have a unique node ID."], "49.03": [609, "Defines the transfer rate of the link. 38.4 kbit/s."], "49.04": [609, "Sets a timeout for control panel (or PC tool) communication. If a communication break lasts longer than the timeout, the action specified by parameter 49.05 Communication loss action is taken."], "49.05": [610, "Selects how the drive reacts to a control panel (or PC tool) communication break."], "49.06": [610, "Applies the settings of parameters 49.01…49.05. Note: Refreshing may cause a communication break, so reconnecting the drive may be required."], "50.01": [610, "Enables/disables communication between the drive and fieldbus adapter A, and specifies the slot the adapter is installed into. Communication between drive and fieldbus adapter A disabled."], "50.02": [610, "enabled. The adapter is in slot 1. Selects how the drive reacts upon a fieldbus communication break. The time delay is defined by parameter 50.03 FBA A comm loss t out. No action taken. Drive trips on fault 7510 FBA A communication."], "50.03": [611, "Defines the time delay before the action defined by parameter 50.02 FBA A comm loss func is taken. Time count starts when the communication link fails to update the message. Notes: • There is a 60-second boot-up delay immediately after power-up."], "50.04": [611, "Selects the type and scaling of reference 1 received from fieldbus adapter A. The scaling of the reference is defined by parameters 46.01…46.04, depending on which reference type is selected by this parameter."], "50.05": [612, "Selects the type and scaling of reference 2 received from fieldbus adapter A. The scaling of the reference is defined by parameters 46.01…46.04, depending on which reference type is selected by this parameter."], "50.06": [612, "Selects the source of the Status word to be sent to the fieldbus network through fieldbus adapter A."], "50.07": [612, "Selects the type and scaling of actual value 1 transmitted to the fieldbus network through fieldbus adapter A. The scaling of the value is defined by parameters 46.01…46.04, depending on which actual value type is selected by this parameter."], "50.08": [613, "Selects the type and scaling of actual value 2 transmitted to the fieldbus network through fieldbus adapter A. The scaling of the value is defined by parameters 46.01…46.04, depending on which actual value type is selected by this parameter."], "50.09": [613, "Selects the source of the fieldbus status word when parameter 50.06 FBA A SW sel is set to Transparent mode. No source selected. Source selection (see Terms and abbreviations on page 394)."], "50.10": [613, "When parameter 50.07 FBA A actual 1 type is set to Transparent, this parameter selects the source of actual value 1 transmitted to the fieldbus network through fieldbus adapter A. No source selected. Source selection (see Terms and abbreviations on page 394)."], "50.11": [613, "When parameter 50.08 FBA A actual 2 type is set to Transparent, this parameter selects the source of actual value 2 transmitted to the fieldbus network through fieldbus adapter A. No source selected. Source selection (see Terms and abbreviations on page 394)."], "50.12": [614, "(unmodified) data received from and sent to fieldbus adapter A in parameters 50.13…50.18."], "50.15": [614, "Displays raw (unmodified) reference REF2 sent by the master (PLC) to fieldbus adapter A if debugging is enabled by parameter 50.12 FBA A debug mode."], "50.16": [614, "Displays the raw (unmodified) status word sent by fieldbus adapter A to the master (PLC) if debugging is enabled by parameter 50.12 FBA A debug mode. This parameter is read-only."], "50.17": [614, "Displays raw (unmodified) actual value ACT1 sent by fieldbus adapter A to the master (PLC) if debugging is enabled by parameter 50.12 FBA A debug mode."], "50.18": [614, "Displays raw (unmodified) actual value ACT2 sent by fieldbus adapter A to the master (PLC) if debugging is enabled by parameter 50.12 FBA A debug mode."], "51.01": [615, "Displays the type of the connected fieldbus adapter module. 0 = None. Module is not found or is not properly connected, or is disabled by parameter 50.01 FBA A enable."], "51.26": [615, "See parameter 51.02 FBA A Par2."], "51.27": [615, "Validates any changed fieldbus adapter module configuration settings. After refreshing, the value reverts automatically to Done. Note: This parameter cannot be changed while the drive is running."], "51.28": [615, "module mapping file (stored in the memory of the drive). In format axyz, where ax = major table revision number; yz = minor table revision number. This parameter is read-only."], "51.29": [615, "Displays the drive type code in the fieldbus adapter module mapping file (stored in the memory of the drive)."], "51.30": [615, "Displays the fieldbus adapter module mapping file revision stored in the memory of the drive in decimal format."], "51.31": [616, "Displays the status of the fieldbus adapter module communication. This parameter is read-only. Note: After the FBA detects a comm loss, it will wait for a time delay before changing this comm status parameter to Off-line. If this time delay exists for an FBA module, then it will be in module specific section."], "51.32": [616, "Displays the common program revision of the adapter module in format axyz, where a = major revision number, xy = minor revision number, z = correction number or letter. Example: 190A = revision 1.90A. Note: This parameter is read-only."], "51.33": [616, "Displays the application program revision of the adapter module in format axyz, where a = major revision number, xy = minor revision number, z = correction number or letter. Example: 190A = revision 1.90A. Note: This parameter is read-only. Application program version of adapter module."], "52.12": [617, "See parameter 52.01 FBA A data in1. Selection of data to be transferred from fieldbus controller to drive through fieldbus adapter A. Note: 32-bit values require two consecutive parameters. Whenever a 32-bit value is selected in a data parameter, the next parameter is automatically reserved."], "53.12": [617, "See parameter 53.01 FBA A data out1. Configuration of the embedded fieldbus (EFB) interface."], "58.01": [617, "Enables/disables the embedded fieldbus interface and selects the protocol to use."], "58.02": [618, "Displays the protocol ID and revision. First 4 bits specify the protocol ID and last 12 bits specify the revision. This parameter is read-only."], "58.03": [618, "Defines the node address of the drive on the fieldbus link. Values 1…247 are allowable. Also called Station ID, MAC Address or Device Address. Two devices with the same address are not allowed on-line."], "58.04": [618, "Selects the transfer rate of the fieldbus link. When using selection Autodetect, the parity setting of the bus must be known and configured in parameter 58.05 Parity. When parameter 58.04 Baud rate is set to Autodetect, the EFB settings must be refreshed with parameter 58.06."], "58.05": [618, "Modbus RTU, N2 only: Selects the type of parity bit and number of stop bits. Changes to this parameter take effect after the control unit is rebooted or the new settings validated by parameter 58.06 Communication control (Refresh settings). Note: For BACnet MS/TP, the BACnet standard defines the parity as 8 NONE 1."], "58.06": [619, "Takes changed EFB settings in use, or activates silent mode. Normal operation."], "58.07": [619, "Displays the status of the EFB communication. This parameter is read-only. Note that the name is only visible when the error is present (bit value is 1)."], "58.08": [619, "Displays a count of valid packets addressed to the drive. During normal operation, this number increases constantly."], "58.09": [620, "Displays a count of valid packets transmitted by the drive. During normal operation, this number increases constantly."], "58.10": [620, "Displays a count of valid packets addressed to any device on the bus. During normal operation, this number increases constantly."], "58.11": [620, "Displays a count of character errors received by the drive. An increasing count indicates a configuration problem on the bus."], "58.12": [620, "Displays a count of packets with a CRC error received by the drive. An increasing count indicates interference on the bus."], "58.13": [620, "BACnet MS/TP only: Contains a count of the number of times this device has received the token."], "58.14": [620, "Selects how the drive reacts to an EFB communication break. No action Changes to this parameter take effect after the control unit is rebooted or the new settings validated by parameter 58.06 Communication control (Refresh settings). See also parameters 58.15 Communication loss mode and 58.16 Communication loss time."], "58.15": [621, "Defines which message types reset the timeout counter for detecting an EFB communication loss. Changes to this parameter take effect after the control unit is rebooted or the new settings validated by parameter 58.06 Communication control (Refresh settings)."], "58.16": [621, "Sets a timeout for EFB communication. If a communication break lasts longer than the timeout, the action specified by parameter 58.14 Communication loss action is taken."], "58.17": [621, "Modbus RTU, N2 only: Defines a minimum response delay in addition to any fixed delay imposed by the protocol."], "58.18": [621, "Modbus RTU, BACnet MS/TP only: Displays the raw (unmodified) control word sent by the Modbus controller to the drive. For debugging purposes. This parameter is read-only."], "58.19": [621, "Modbus RTU, BACnet MS/TP only: Displays the raw (unmodified) status word for debugging purposes. This parameter is read-only. Status word sent by the drive to the Modbus controller."], "58.25": [622, "Modbus RTU only: Defines the communication profile used by the Modbus protocol. Changes to this parameter take effect after the control unit is rebooted or the new settings validated by parameter 58.06 Communication control (Refresh settings). See section About the control profiles on page 280."], "58.26": [622, "Modbus RTU only: Selects the type and scaling of reference 1 received through the embedded fieldbus interface. The scaled reference is displayed by 03.09 EFB reference 1."], "58.27": [622, "Modbus RTU only: Selects the type and scaling of reference 2 received through the embedded fieldbus interface."], "58.28": [622, "Modbus RTU only: Selects the type of actual value 1. Type and scaling is chosen automatically according to the"], "58.29": [623, "Modbus RTU only: Selects the type of actual value 2. For the selections, see parameter 58.28 EFB act1 type."], "58.30": [623, "N2 only: Selects the source of actual value 1 when parameter 58.28 EFB act1 type is set to Transparent."], "58.31": [623, "Modbus RTU only: Selects the source of actual value 1 when parameter 58.28 EFB act1 type is set to Transparent."], "58.32": [623, "Modbus RTU, N2 only: Selects the source of actual value 2 when parameter 58.29 EFB act2 type is set to Transparent."], "58.33": [623, "Modbus RTU only: Defines the mapping between parameters and holding registers in the 400101…465535 Modbus register range. Changes to this parameter take effect after the control unit is rebooted or the new settings validated by parameter 58.06 Communication control (Refresh settings)."], "58.34": [623, "Modbus RTU only: Selects in which order 16-bit registers of 32-bit parameters are transferred. For each register, the first byte contains the high order byte and the second byte contains the low order byte."], "58.40": [624, "BACnet MS/TP only: The Device object ID must be unique across all BACnet devices in the building network. Valid values are in range 0…4194303."], "58.41": [624, "BACnet MS/TP only: The highest master address for devices on the BACnet MS/TP bus."], "58.42": [624, "BACnet MS/TP only: The maximum number of information frames the device may transmit before it must pass the token."], "58.43": [624, "BACnet MS/TP only: Number of retries to send when no response is seen to confirmed requests."], "58.44": [624, "BACnet MS/TP only: The amount of time in seconds between retransmissions when an expected acknowledgement has not been received."], "60.78": [626, "Sets a timeout for communication with another converter (such as the supply unit)."], "60.79": [626, "Selects how the inverter unit reacts to a communication break between the inverter unit and the other converter (typically the supply unit). WARNING! With settings other than Fault, the inverter unit will continue operating based on the status information that was last received from the other converter."], "70.01": [627, "Shows the override status. This parameter is read-only. Description 0 = Override is disabled; 1 = Override is enabled. 0 = Override is inactive; 1 = Drive is active. 0 = Override direction is not forward; 1 = Override direction is forward. 0 = Override direction is not reverse; 1 = Override direction is reverse."], "70.02": [627, "Enables the Override function. For Override with ACH580-31 and ACH580-34, see section LSU Override on page 119."], "70.03": [627, "Selects the source of the Override activation. Value 0 of the source deactivates the Override. Value 1 of the source activates the Override."], "70.04": [628, "Selects the source for the speed used in the Override mode. Constant speed used as the reference."], "70.05": [628, "Selects the source of the motor direction used in the Override mode. Direction is forward. Direction is reverse."], "70.06": [628, "Defines the frequency used as reference in the Override mode if 70.04 Override reference source is set to Override speed/freq and the drive is in frequency mode."], "70.07": [629, "Defines the speed used in as reference the Override mode if 70.04 Override reference source is set to Override speed/freq and the drive is in speed mode."], "70.21": [629, "Defines the number of automatic fault resets the drive performs during Override operation. When the parameter is set to 0, reset trials are made continuously during the Override operation."], "70.22": [630, "Defines the time the drive will wait after a fault before attempting an automatic fault reset."], "70.40": [630, "Displays the start date of the last Override activation. Start date."], "70.41": [630, "Displays the start time of the last Override activation. Start time."], "70.42": [630, "Displays the end date of the last Override situation. If the drive is in Override mode, the parameter shows the current date."], "70.43": [630, "Displays the end time of the last Override situation. If the drive is in Override mode, the parameter shows the current time."], "70.44": [630, "Displays the last fault, if any, that occurred during the last operation of Override."], "70.45": [630, "Displays the second last fault, if any, that occurred during the last operation of Override. Fault description. Displays the third last fault, if any, that occurred during the last operation of Override. Fault description. Displays the last warning, if any, that occurred during the last operation of Override."], "70.48": [630, "Displays the second last warning, if any, that occurred during the last operation of Override."], "70.49": [630, "Displays the third last warning, if any, that occurred during the last operation of Override."], "70.50": [630, "Displays the start date of the second last Override activation."], "70.51": [630, "Displays the start time of the second last Override activation."], "70.52": [630, "Start time. Displays the end date of the second last Override situation. End date."], "70.53": [631, "Displays the end time of the second last Override situation. End time."], "70.54": [631, "Displays the last fault, if any, that occurred during the second last operation of Override."], "70.55": [631, "Displays the second last fault, if any, that occurred during the second last operation of Override."], "70.56": [631, "Displays the third last fault, if any, that occurred during the second last operation of Override."], "70.57": [631, "Displays the last warning, if any, that occurred during the second last operation of Override."], "70.58": [631, "Displays the second last warning, if any, that occurred during second the last operation of Override."], "70.59": [631, "Displays the third last warning, if any, that occurred during the second last operation of Override."], "70.60": [631, "Displays the start date of the third last Override activation."], "70.61": [631, "Displays the start time of the third last Override activation."], "70.62": [631, "Displays the end date of the third last Override situation. End date."], "70.63": [631, "Displays the end time of the third last Override situation. End time."], "70.64": [631, "Displays the last fault, if any, that occurred during the third last operation of Override."], "70.65": [631, "Displays the second last fault, if any, that occurred during the third last operation of Override Fault description."], "70.66": [631, "Displays the third last fault, if any, that occurred during the third last operation of Override. Fault description. Displays the last warning, if any, that occurred during the third last operation of Override. Warning description."], "70.69": [632, "Displays the third last warning, if any, that occurred during the third last operation of Override. Warning description. Configuration of external PID."], "71.01": [632, "See parameter 40.01 Process PID output actual."], "71.02": [632,
